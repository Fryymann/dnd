\r\nNick. When you make the extra attack of the Light property, you can make it as part of the Attack action instead of as a Bonus Action. You can make this extra attack only once per turn.","limitedUse":null,"chargesUsed":0},{"id":"653171606","name":"Crowbar","originalName":null,"note":null,"type":"Other Gear","subType":"Adventuring Gear","rarity":"Common","magic":false,"quantity":1,"weight":5,"equipped":false,"attuned":false,"canAttune":false,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"Using a crowbar grants advantage to Strength checks where the crowbar's leverage can be applied.","limitedUse":null,"chargesUsed":0},{"id":"653171608","name":"Rations (1 day)","originalName":null,"note":null,"type":"Other Gear","subType":"Adventuring Gear","rarity":"Common","magic":false,"quantity":10,"weight":2,"equipped":false,"attuned":false,"canAttune":false,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"Rations consist of dry foods suitable for extended travel, including jerky, dried fruit, hardtack, and nuts.","limitedUse":null,"chargesUsed":0},{"id":"653171607","name":"Tinderbox","originalName":null,"note":null,"type":"Other Gear","subType":"Adventuring Gear","rarity":"Common","magic":false,"quantity":1,"weight":1,"equipped":false,"attuned":false,"canAttune":false,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"This small container holds flint, fire steel, and tinder (usually dry cloth soaked in light oil) used to kindle a fire. Using it to light a torch -- or anything else with abundant, exposed fuel -- takes an action. Lighting any other fire takes 1 minute.","limitedUse":null,"chargesUsed":0},{"id":"653171609","name":"Waterskin","originalName":null,"note":null,"type":"Other Gear","subType":"Adventuring Gear","rarity":"Common","magic":false,"quantity":1,"weight":5,"equipped":false,"attuned":false,"canAttune":false,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"A waterskin can hold 4 pints of liquid.","limitedUse":null,"chargesUsed":0},{"id":"749792867","name":"Shovel","originalName":null,"note":null,"type":"Other Gear","subType":"Adventuring Gear","rarity":"Common","magic":false,"quantity":1,"weight":5,"equipped":false,"attuned":false,"canAttune":false,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"Working for 1 hour, you can use a Shovel to dig a hole that is 5 feet on each side in soil or similar material.","limitedUse":null,"chargesUsed":0},{"id":"853228255","name":"Holy Water","originalName":null,"note":null,"type":"Other Gear","subType":"Adventuring Gear","rarity":"Common","magic":false,"quantity":4,"weight":1,"equipped":false,"attuned":false,"canAttune":false,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"When you take the Attack action, you can replace one of your attacks with throwing a flask of Holy Water. Target one creature you can see within 20 feet of yourself. The target must succeed on a Dexterity saving throw (DC 8 plus your Dexterity modifier and Proficiency Bonus) or take 2d8 Radiant damage if it is a Fiend or an Undead.","limitedUse":null,"chargesUsed":0},{"id":"749792825","name":"Climber's Kit","originalName":null,"note":null,"type":"Other Gear","subType":"Adventuring Gear","rarity":"Common","magic":false,"quantity":1,"weight":12,"equipped":false,"attuned":false,"canAttune":false,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"A Climber’s Kit includes boot tips, gloves, pitons, and a harness. As a Utilize action, you can use the Climber’s Kit to anchor yourself; when you do, you can’t fall more than 25 feet from the anchor point, and you can’t move more than 25 feet from there without undoing the anchor as a Bonus Action.","limitedUse":null,"chargesUsed":0},{"id":"781135702","name":"Armor of Paladine","originalName":"Splint, +1","note":"The symbol of the Knights of the Crown is on the chest.","type":"Armor","subType":null,"rarity":"Rare","magic":true,"quantity":1,"weight":60,"equipped":false,"attuned":false,"canAttune":false,"armorClass":17,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"You have a +1 bonus to AC while wearing this armor.","limitedUse":null,"chargesUsed":0},{"id":"735974227","name":"Crownguard","originalName":"Longsword","note":"Blessed to guard and protect. Use reaction to impose disadvantage on enemy attacking homie.","type":"Weapon","subType":null,"rarity":"Common","magic":false,"quantity":1,"weight":3,"equipped":false,"attuned":false,"canAttune":false,"armorClass":null,"damage":"1d8","damageType":"Slashing","range":5,"longRange":5,"properties":["Versatile","Sap"],"magicBonus":0,"riders":[],"snippet":"","description":"Proficiency with a Longsword allows you to add your proficiency bonus to the attack roll for any attack you make with it.\n\r\n\r\nThis weapon has the following mastery property. To use this property, you must have a feature that lets you use it.\n\r\nSap. If you hit a creature with this weapon, that creature has Disadvantage on its next attack roll before the start of your next turn.","limitedUse":null,"chargesUsed":0},{"id":"custom-23379509","name":"Copy of script on brass of door","custom":true,"quantity":1,"weight":null,"description":""},{"id":"custom-25593740","name":"Stack of Clay Pre-Cataclysm Discs","custom":true,"quantity":1,"weight":null,"description":""},{"id":"custom-28867924","name":"Horn of Cryonisis","custom":true,"quantity":1,"weight":null,"description":""},{"id":"custom-30225304","name":"Haskasorian Artifact","custom":true,"quantity":1,"weight":null,"description":""},{"id":"custom-30225388","name":"5,000 gold worth of treasure","custom":true,"quantity":1,"weight":null,"description":""},{"id":"custom-31326937","name":"Red Dust","custom":true,"quantity":1,"weight":null,"description":""}],"features":[{"name":"Core Paladin Traits","level":1,"source":"Paladin","subclass":false,"snippet":"","description":"As a Level 1 Character:\n\r\n\r\n• Gain all the traits in the Core Paladin Traits table.\n\r\n• Gain the Paladin’s level 1 features, which are listed in the Paladin Features table.\n\r\n\r\nCore Paladin Traits\r\n\r\n\r\nPrimary Ability\r\nStrength and Charisma\r\n\n\r\n\r\nHit Point Die\r\nD10 per Paladin level\r\n\n\r\n\r\nSaving Throw Proficiencies\r\nWisdom and Charisma\r\n\n\r\n\r\nSkill Proficiencies\r\nChoose 2: Athletics, Insight, Intimidation, Medicine, Persuasion, or Religion\r\n\n\r\n\r\nWeapon Proficiencies\r\nSimple and Martial weapons\r\n\n\r\n\r\nArmor Training\r\nLight, Medium, and Heavy armor and Shields\r\n\n\r\n\r\nStarting Equipment\r\nChoose A or B: (A) Chain Mail, Shield, Longsword, 6 Javelins, Holy Symbol, Priest’s Pack, and 9 GP; or (B) 150 GP","levelScale":null},{"name":"Lay On Hands","level":1,"source":"Paladin","subclass":false,"snippet":"You have a pool of healing power that replenishes when you finish a Long Rest. With that pool, you can restore a total of {{5*classlevel}} HP.\r\n\r\nAs a Bonus Action, you can touch a creature (which could be yourself) and restore a number HP to that creature, up to the maximum amount remaining in the pool.\r\n\r\nYou can also expend 5 HP from the pool of healing to remove the Poisoned condition from the creature; those points don’t also restore HP to the creature.","description":"Your blessed touch can heal wounds. You have a pool of healing power that replenishes when you finish a Long Rest. With that pool, you can restore a total number of Hit Points equal to five times your Paladin level.\n\r\nAs a Bonus Action, you can touch a creature (which could be yourself) and draw power from the pool of healing to restore a number of Hit Points to that creature, up to the maximum amount remaining in the pool.\n\r\nYou can also expend 5 Hit Points from the pool of healing power to remove the Poisoned condition from the creature; those points don’t also restore Hit Points to the creature.","levelScale":null},{"name":"Spellcasting","level":1,"source":"Paladin","subclass":false,"snippet":"","description":"You have learned to cast spells through prayer and meditation.\n\r\nSpell Slots. The Paladin Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a Long Rest.\n\r\nPrepared Spells of Level 1+. You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose two level 1 Paladin spells.\n\r\nThe number of spells on your list increases as you gain Paladin levels, as shown in the Prepared Spells column of the Paladin Features table. Whenever that number increases, choose additional Paladin spells until the number of spells on your list matches the number in the Paladin Features table. The chosen spells must be of a level for which you have spell slots. For example, if you’re a level 5 Paladin, your list of prepared spells can include six Paladin spells of level 1 or 2 in any combination.\n\r\nIf another Paladin feature gives you spells that you always have prepared, those spells don’t count against the number of spells you can prepare with this feature, but those spells otherwise count as Paladin spells for you.\n\r\nChanging Your Prepared Spells. Whenever you finish a Long Rest, you can replace one spell on your list with another Paladin spell for which you have spell slots.\n\r\nSpellcasting Ability. Charisma is your spellcasting ability for your Paladin spells.\n\r\nSpellcasting Focus. You can use a Holy Symbol as a Spellcasting Focus for your Paladin spells.","levelScale":null},{"name":"Weapon Mastery","level":1,"source":"Paladin","subclass":false,"snippet":"","description":"Your training with weapons allows you to use the mastery properties of two kinds of weapons of your choice with which you have proficiency, such as Longswords and Javelins.\n\r\nWhenever you finish a Long Rest, you can change the kinds of weapons you chose. For example, you could switch to using the mastery properties of Halberds and Flails.","levelScale":null},{"name":"Fighting Style","level":2,"source":"Paladin","subclass":false,"snippet":"","description":"You gain a Fighting Style feat of your choice. Instead of choosing one of those feats, you can choose the option below.","levelScale":null},{"name":"Paladin’s Smite","level":2,"source":"Paladin","subclass":false,"snippet":"You always have Divine Smite prepared and cast it without expending a spell slot once per Long Rest.","description":"You always have the Divine Smite spell prepared. In addition, you can cast it without expending a spell slot, but you must finish a Long Rest before you can cast it in this way again.","levelScale":null},{"name":"Channel Divinity","level":3,"source":"Paladin","subclass":false,"snippet":"You can channel energy directly from the Outer Planes to fuel magical effects. Each time you use this class’s Channel Divinity, you can choose which effect to create. You can use this class’s Channel Divinity {{scalevalue}} times per Long Rest, but can regain one expended use after finishing a Short Rest.\r\n\r\nIf your Channel Divinity requires a saving throw, the DC equals your Paladin spell save DC (DC {{savedc:cha}}).","description":"You can channel divine energy directly from the Outer Planes, using it to fuel magical effects. You start with one such effect: Divine Sense, which is described below. Other Paladin features give additional Channel Divinity effect options. Each time you use this class’s Channel Divinity, you choose which effect from this class to create.\n\r\nYou can use this class’s Channel Divinity twice. You regain one of its expended uses when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest. You gain an additional use when you reach Paladin level 11.\n\r\nIf a Channel Divinity effect requires a saving throw, the DC equals the spell save DC from this class’s Spellcasting feature.\n\r\nDivine Sense. As a Bonus Action, you can open your awareness to detect Celestials, Fiends, and Undead. For the next 10 minutes or until you have the Incapacitated condition, you know the location of any creature of those types within 60 feet of yourself, and you know its creature type. Within the same radius, you also detect the presence of any place or object that has been consecrated or desecrated, as with the Hallow spell.","levelScale":"Channel Divinity"},{"name":"Channel Divinity (Legacy)","level":3,"source":"Paladin","subclass":false,"snippet":"You gain two Channel Divinity options:\r\n\r\nChampion Challenge - As a bonus action, each creature of your choice within 30 ft. must make a Wis saving throw (DC {{savedc:cha}}) or it can't willingly move more than 30 ft. away from you.\r\n\r\nTurn the Tide - As a bonus action, each creature of your choice within 30 ft. regains 1d6{{modifier:cha@min:1}} HP if it has no more than half its max HP.","description":"When you take this oath at 3rd level, you gain the following Channel Divinity options.\n\r\nChampion Challenge. As a bonus action, you issue a challenge that compels other creatures to do battle with you. Each creature of your choice that you can see within 30 feet of you must make a Wisdom saving throw. On a failed save, a creature can’t willingly move more than 30 feet away from you. This effect ends on the creature if you are incapacitated or die or if the creature is more than 30 feet away from you.\n\r\nTurn the Tide. As a bonus action, you can bolster injured creatures with your Channel Divinity. Each creature of your choice that can hear you within 30 feet of you regains hit points equal to 1d6 + your Charisma modifier (minimum of 1) if it has no more than half of its hit points.","levelScale":null},{"name":"Oath Spells","level":3,"source":"Paladin","subclass":false,"snippet":"You gain oath spells based on your level that are always prepared and don't count against your daily number of prepared spells.","description":"You gain oath spells at the paladin levels listed.\n\r\nOath of the Crown Spells\n\r\n\r\n\r\n\r\nPaladin Level\r\nSpells\r\n\n\r\n\r\n\r\n\r\n3rd\r\ncommand, compelled duel\r\n\n\r\n\r\n5th\r\nwarding bond, zone of truth\r\n\n\r\n\r\n9th\r\naura of vitality, spirit guardians\r\n\n\r\n\r\n13th\r\nbanishment, guardian of faith\r\n\n\r\n\r\n17th\r\ncircle of power, geas","levelScale":null},{"name":"Paladin Subclass","level":3,"source":"Paladin","subclass":false,"snippet":"","description":"You gain a Paladin subclass of your choice. A subclass is a specialization that grants you features at certain Paladin levels. For the rest of your career, you gain each of your subclass’s features that are of your Paladin level or lower.","levelScale":null},{"name":"Ability Score Improvement","level":4,"source":"Paladin","subclass":false,"snippet":"","description":"You gain the Ability Score Improvement feat or another feat of your choice for which you qualify. You gain this feature again at Paladin levels 8, 12, and 16.","levelScale":null},{"name":"Extra Attack","level":5,"source":"Paladin","subclass":false,"snippet":"You can attack twice instead of once whenever you take the Attack action on your turn.","description":"You can attack twice instead of once whenever you take the Attack action on your turn.","levelScale":null},{"name":"Faithful Steed","level":5,"source":"Paladin","subclass":false,"snippet":"You always have Find Steed prepared, and can cast it once per Long Rest without expending a spell slot.","description":"You can call on the aid of an otherworldly steed. You always have the Find Steed spell prepared.\n\r\nYou can also cast the spell once without expending a spell slot, and you regain the ability to do so when you finish a Long Rest.","levelScale":null},{"name":"Aura of Protection","level":6,"source":"Paladin","subclass":false,"snippet":"You radiate a protective aura in a {{scalevalue}}-ft. Emanation that originates from you. The aura is inactive if you have the Incapacitated condition.\r\n\r\nYou and your allies in the aura gain a {{modifier:cha@min:1#signed}} to saving throws while in the aura. If another Paladin is present, a creature can benefit from only one Aura of Protection at a time; and chooses which aura while in them.","description":"You radiate a protective, unseeable aura in a 10-foot Emanation that originates from you. The aura is inactive while you have the Incapacitated condition.\n\r\nYou and your allies in the aura gain a bonus to saving throws equal to your Charisma modifier (minimum bonus of +1).\n\r\nIf another Paladin is present, a creature can benefit from only one Aura of Protection at a time; the creature chooses which aura while in them.","levelScale":"Aura of Protection Emanation"},{"name":"Divine Allegiance","level":7,"source":"Paladin","subclass":false,"snippet":"When a creature within 5 ft. of you takes damage, you can use your reaction to take the damage yourself instead. This damage to you can’t be reduced or prevented in any way.","description":"Starting at 7th level, when a creature within 5 feet of you takes damage, you can use your reaction to magically substitute your own health for that of the target creature, causing that creature not to take the damage. Instead, you take the damage. This damage to you can’t be reduced or prevented in any way.","levelScale":null},{"name":"8: Ability Score Improvement","level":8,"source":"Paladin","subclass":false,"snippet":"","description":"You gain the Ability Score Improvement feat or another feat of your choice for which you qualify. You gain this feature again at Paladin levels 12 and 16.","levelScale":null},{"name":"Abjure Foes","level":9,"source":"Paladin","subclass":false,"snippet":"As a Magic action, you can expend on use of this class’s Channel Divinity to overwhelm foes. As you present your Holy Symbol or weapon, you can target up to {{modifier:cha#min:1,unsigned}} creatures that you can see within 60 ft. Each one must make a DC {{savedc:cha}} Wis. saving throw or have the Frightened condition for 1 minute, or until it takes damage.\r\n\r\nWhile Frightened, a target can only do one of the following on its turn: move, take an action, or take a Bonus Action.","description":"As a Magic action, you can expend one use of this class’s Channel Divinity to overwhelm foes with awe. As you present your Holy Symbol or weapon, you can target a number of creatures equal to your Charisma modifier (minimum of one creature) that you can see within 60 feet of yourself. Each target must succeed on a Wisdom saving throw or have the Frightened condition for 1 minute or until it takes any damage. While Frightened in this way, a target can do only one of the following on its turns: move, take an action, or take a Bonus Action.","levelScale":null},{"name":"Aura of Courage","level":10,"source":"Paladin","subclass":false,"snippet":"You and your allies have Immunity to the Frightened condition while in your Aura of Protection. If a Frightened ally enters the aura, that condition has no effect on that ally while there.","description":"You and your allies have Immunity to the Frightened condition while in your Aura of Protection. If a Frightened ally enters the aura, that condition has no effect on that ally while there.","levelScale":null},{"name":"Radiant Strikes","level":11,"source":"Paladin","subclass":false,"snippet":"When you hit a target with an attack roll using a Melee weapon or Unarmed Strike, the target takes an additional 1d8 Radiant damage.","description":"Your strikes now carry supernatural power. When you hit a target with an attack roll using a Melee weapon or an Unarmed Strike, the target takes an extra 1d8 Radiant damage.","levelScale":null},{"name":"12: Ability Score Improvement","level":12,"source":"Paladin","subclass":false,"snippet":"","description":"You gain the Ability Score Improvement feat or another feat of your choice for which you qualify. You gain this feature again at Paladin level 16.","levelScale":null},{"name":"Restoring Touch","level":14,"source":"Paladin","subclass":false,"snippet":"When you use Lay on Hands on a creature, you can also remove one or more of the following conditions, expending 5 Hit Points from the healing point for each one removed: Blinded, Charmed, Deafened, Frightened, Paralyzed, or Stunned. The points spent removing the conditions don't also restore HP to the creature.","description":"When you use Lay On Hands on a creature, you can also remove one or more of the following conditions from the creature: Blinded, Charmed, Deafened, Frightened, Paralyzed, or Stunned. You must expend 5 Hit Points from the healing pool of Lay On Hands for each of these conditions you remove; those points don’t also restore Hit Points to the creature.","levelScale":null}],"feats":[{"name":"Alert","snippet":"You gain a +5 bonus to initiative, you can't be surprised while you are conscious, and other creatures don’t gain advantage on attack rolls against you as a result of being unseen by you.","description":"Always on the lookout for danger, you gain the following benefits:\n\r\n\r\n• You gain a +5 bonus to initiative.\n\r\n• You can't be surprised while you are conscious.\n\r\n• Other creatures don’t gain advantage on attack rolls against you as a result of being unseen by you."},{"name":"Knight of the Crown","snippet":"You are a Knight of Solamnia aligned with the Order of the Crown, a group that extols the virtues of cooperation, loyalty, and obedience. You excel in group combat and gain these benefits:\r\n\r\nAbility Score Increase. Increase your Strength, Dexterity, or Constitution score by 1, to a maximum of 20.\r\n\r\nCommanding Rally. As a bonus action, you can command one ally within 30 ft. of yourself to attack. If that ally can see or hear you, they can immediately make one weapon attack as a reaction. If the attack hits, the ally can roll a d8 and add the number rolled as a bonus to the attack’s damage roll. You can use this bonus action {{proficiency#unsigned}} times per long rest.","description":"You are a Knight of Solamnia aligned with the Order of the Crown, a group that extols the virtues of cooperation, loyalty, and obedience. You excel in group combat and gain these benefits:\n\r\nAbility Score Increase. Increase your Strength, Dexterity, or Constitution score by 1, to a maximum of 20.\n\r\nCommanding Rally. As a bonus action, you can command one ally within 30 feet of yourself to attack. If that ally can see or hear you, they can immediately make one weapon attack as a reaction. If the attack hits, the ally can roll a d8 and add the number rolled as a bonus to the attack’s damage roll. You can use this bonus action a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest.\n\r\n\r\nMEMBERSHIP IN KNIGHTLY ORDERS\n\r\nKnights of Solamnia are only ever members of one of their organization’s orders. In the course of their training, most knights begin as members of the Knights of the Crown and then move on to join other orders. Whether a character follows this path or another, they retain what they learned as a member of an order even if they join another. Characters can change what knightly order they’re a part of, but they always have access to any Knight of Solamnia feats they’ve acquired."},{"name":"Squire of Solamnia","snippet":"Your training in the ways of the Knights of Solamnia grants you these benefits:\r\n\r\nMount Up. Mounting or dismounting costs you only 5 ft. of movement.\r\n\r\nPrecise Strike. Once per turn, when you make a weapon attack roll against a creature, you can cause the attack roll to have advantage. If the attack hits, you roll a d8 and add the number rolled as a bonus to the attack’s damage roll. You can use this benefit {{proficiency#unsigned}} times per long rest, but a use is expended only if the attack hits.","description":"Your training in the ways of the Knights of Solamnia grants you these benefits:\n\r\nMount Up. Mounting or dismounting costs you only 5 feet of movement.\n\r\nPrecise Strike. Once per turn, when you make a weapon attack roll against a creature, you can cause the attack roll to have advantage. If the attack hits, you roll a d8 and add the number rolled as a bonus to the attack’s damage roll. You can use this benefit a number of times equal to your proficiency bonus, but a use is expended only if the attack hits. You regain all expended uses when you finish a long rest."},{"name":"Athlete","snippet":"Ability Score Increase. Str. or Dex. increased by 1.\r\n\r\nClimb Speed. You gain a Climb Speed of {{speed}} ft.\r\n\r\nHop Up. When you have the Prone condition, you can right yourself with only 5 ft. of movement.\r\n\r\nJumping. You can make a running Long or High Jump after moving only 5 ft.","description":"General Feat (Prerequisite: Level 4+, Strength or Dexterity 13+)\n\r\nYou gain the following benefits.\n\r\nAbility Score Increase. Increase your Strength or Dexterity score by 1, to a maximum of 20.\n\r\nClimb Speed. You gain a Climb Speed equal to your Speed.\n\r\nHop Up. When you have the Prone condition, you can right yourself with only 5 feet of movement.\n\r\nJumping. You can make a running Long or High Jump after moving only 5 feet."},{"name":"Blind Fighting","snippet":"You have Blindsight with a range of 10 ft.","description":"Fighting Style Feat (Prerequisite: Fighting Style Feature)\n\r\nYou have Blindsight with a range of 10 feet."},{"name":"Charger","snippet":"Ability Score Increase. Increase your Str. or Dex. by 1.\r\n\r\nImproved Dash. When you Dash, your speed increases by 10 ft. for that action.\r\n\r\nCharge Attack. If you move at least 10 ft. in a straight line toward a target immediately before hitting a melee attack roll, choose one of the following effects: gain 1d8 bonus damage to the attack, or push the target up to 10 ft. away from you if it is no more than one size larger than you.","description":"General Feat (Prerequisite: Level 4+, Strength or Dexterity 13+)\n\r\nYou gain the following benefits.\n\r\nAbility Score Increase. Increase your Strength or Dexterity score by 1, to a maximum of 20.\n\r\nImproved Dash. When you take the Dash action, your Speed increases by 10 feet for that action.\n\r\nCharge Attack. If you move at least 10 feet in a straight line toward a target immediately before hitting it with a melee attack roll as part of the Attack action, choose one of the following effects: gain a 1d8 bonus to the attack’s damage roll, or push the target up to 10 feet away if it is no more than one size larger than you. You can use this benefit only once on each of your turns."},{"name":"Inspiring Leader","snippet":"Ability Score Increase. Wisdom or Charisma increased by 1. \r\n\r\nBolstering Performance. After a Short or Long Rest, give a performance. When you do, up to six allies (which can include yourself) within 30 ft. of yourself gain Temporary HP equal to your character level plus the modifier of the ability you increased with this feat.","description":"General Feat (Prerequisite: Level 4+, Wisdom or Charisma 13+)\n\r\nYou gain the following benefits.\n\r\nAbility Score Increase. Increase your Wisdom or Charisma score by 1, to a maximum of 20.\n\r\nBolstering Performance. When you finish a Short or Long Rest, you can give an inspiring performance: a speech, song, or dance. When you do so, choose up to six allies (which can include yourself) within 30 feet of yourself who witness the performance. The chosen creatures each gain Temporary Hit Points equal to your character level plus the modifier of the ability you increased with this feat."},{"name":"Mage Slayer","snippet":"Ability Score Increase. Increase your Str. or Dex. by 1.\r\n\r\nConcentration Breaker. When you damage a creature that is concentrating, it has Disadvantage on the saving throw it makes to maintain Concentration.\r\n\r\nGuarded Mind. If you fail an Int., Wis., or Cha. saving throw, you can cause yourself to succeed instead. You can't use this again until after a Short or Long Rest.","description":"General Feat (Prerequisite: Level 4+)\n\r\nYou gain the following benefits.\n\r\nAbility Score Increase. Increase your Strength or Dexterity score by 1, to a maximum of 20.\n\r\nConcentration Breaker. When you damage a creature that is concentrating, it has Disadvantage on the saving throw it makes to maintain Concentration.\n\r\nGuarded Mind. If you fail an Intelligence, a Wisdom, or a Charisma saving throw, you can cause yourself to succeed instead. Once you use this benefit, you can’t use it again until you finish a Short or Long Rest."},{"name":"Magic Initiate (Cleric)","snippet":"Two Cantrips. You learn two cantrips of your choice from the Cleric spell list. Int., Wis., or Cha. is your spellcasting ability for this feat's spells.\r\n\r\nLevel 1 Spell. Choose a level 1 spell from the Cleric spell list. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a Long Rest. You can also cast the spell using any spell slots you have.\r\n\r\nSpell Change. Whenever you gain a new level, you can replace one of the spells you chose for this feat with a different spell of the same level from the chosen spell list.\r\n\r\nRepeatable. You can take this feat more than once, but you must choose a different spell list each time.","description":"Origin Feat\n\r\nYou gain the following benefits.\n\r\nTwo Cantrips. You learn two cantrips of your choice from the Cleric spell list. Intelligence, Wisdom, or Charisma is your spellcasting ability for this feat’s spells (choose when you select this feat).\n\r\nLevel 1 Spell. Choose a level 1 spell from the same list you selected for this feat’s cantrips. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a Long Rest. You can also cast the spell using any spell slots you have.\n\r\nSpell Change. Whenever you gain a new level, you can replace one of the spells you chose for this feat with a different spell of the same level from the chosen spell list.\n\r\nRepeatable. You can take this feat more than once, but you must choose a different spell list each time."},{"name":"Mounted Combatant","snippet":"Ability Score Increase. Increase your Str., Dex., or Wis. by 1.\r\n\r\nMounted Strike. While mounted, you have Advantage on attack rolls against any unmounted creature within 5 ft. of your mount that is at least one size smaller than the mount.\r\n\r\nLeap Aside. If your mount is subjected to an effect that allows it to make a Dexterity saving throw to take only half damage, it instead takes no damage on a success and only half damage on a fail. To use this benefit, you must be riding the mount and neither of you can be Incapacitated.\r\n\r\nVeer. While mounted, you can force an attack to hit you instead of your mount if you aren't Incapacitated.","description":"General Feat (Prerequisite: Level 4+)\n\r\nYou gain the following benefits.\n\r\nAbility Score Increase. Increase your Strength, Dexterity, or Wisdom score by 1, to a maximum of 20.\n\r\nMounted Strike. While mounted, you have Advantage on attack rolls against any unmounted creature within 5 feet of your mount that is at least one size smaller than the mount.\n\r\nLeap Aside. If your mount is subjected to an effect that allows it to make a Dexterity saving throw to take only half damage, it instead takes no damage if it succeeds on the saving throw and only half damage if it fails. For your mount to gain this benefit, you must be riding it, and neither of you can have the Incapacitated condition.\n\r\nVeer. While mounted, you can force an attack that hits your mount to hit you instead if you don’t have the Incapacitated condition."},{"name":"Observant","snippet":"Ability Score Increase. Int. or Wis. increased by 1.\r\n\r\nKeen Observer. Choose one of the following skills: Insight, Investigation, or Perception. If you lack proficiency with the chosen skill, you gain proficiency in it, and if you already have proficiency in it, you gain Expertise in it.\r\n\r\nQuick Search. You can take the Search action as a Bonus Action.","description":"General Feat (Prerequisite: Level 4+, Intelligence or Wisdom 13+)\n\r\nYou gain the following benefits.\n\r\nAbility Score Increase. Increase your Intelligence or Wisdom score by 1, to a maximum of 20.\n\r\nKeen Observer. Choose one of the following skills: Insight, Investigation, or Perception. If you lack proficiency with the chosen skill, you gain proficiency in it, and if you already have proficiency in it, you gain Expertise in it.\n\r\nQuick Search. You can take the Search action as a Bonus Action."},{"name":"Polearm Master","snippet":"Ability Score Increase. Increase your Dex. or Str. by 1.\r\n\r\nPole Strike. Immediately after you attack with a Quarterstaff, a Spear, or a weapon with the Heavy and Reach properties, you can use a Bonus Action to make a melee attack. This deals 1d4 Bludgeoning damage.\r\n\r\nReactive Strike. While holding a a Quarterstaff, a Spear, or a weapon with the Heavy and Reach properties, you can take a Reaction to make one melee attack against a creature that enters into that weapon's reach.","description":"General Feat (Prerequisite: Level 4+, Strength or Dexterity 13+)\n\r\nYou gain the following benefits.\n\r\nAbility Score Increas /* Turn-by-turn decision tree, from the Notion gameplay reference. */
const TREE = [
  ["Concentration active?", "Yes → protect it (move smart). No → Spirit Guardians or Bless on round 1."],
  ["Enemies within 30 ft and clustered?", "Yes → Champion Challenge. One dangerous enemy instead → Abjure Foes. No → move or Dash to close, and Charger turns that into +1d8 or a push."],
  ["Two or more allies below half HP?", "Yes → Turn the Tide. Bonus action, mass heal, no slot spent."],
  ["One ally below half within reach?", "Lay on Hands — or Restoring Touch if they're locked down rather than hurt — or position for Divine Allegiance."],
  ["Attack 1", "Precise Strike if it's a priority target. The use is only spent if it hits."],
  ["Attack 2", "Regular swing. Radiant Strikes rides both automatically."],
  ["On any hit", "Smite decision: crit → biggest slot · boss low → mid slot · random hit → save it."],
  ["Bonus action", "Commanding Rally › polearm butt (if not smiting) › animate the shield › Lay on Hands."],
  ["End turn — hold the reaction for", "Polearm OA on reach entry · Divine Allegiance on an ally hit · Save-a-Homie!"],
];

const el = (t, c, h) => { const n = document.createElement(t);
  if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sgn = n => (n >= 0 ? "+" : "") + n;
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const avg = dice => { const m = /(\d+)d(\d+)/.exec(dice || "");
  return m ? (+m[1]) * ((+m[2]) + 1) / 2 : 0; };

const ability = k => DATA.abilities.find(a => a.key === k);

/* D&D Beyond's export returns `prepared: false` for every spell, including ones
   the live sheet has prepared, so the field is unusable. The page owns this
   state instead: seeded from the character's own class list, then yours to
   correct once — it persists like every other tracker. */
const isPrepared = sp => sp.alwaysPrepared || !sp.canPrepare
  ? true : (S.prepared[sp.name] !== false);
const preparedCount = () =>
  DATA.spells.filter(s => s.canPrepare && isPrepared(s)).length;
const actionByName = n => DATA.actions.find(a => a.name === n);
const resMax = id => RESOURCES.find(r => r.id === id).max;
const resLeft = id => resMax(id) - (S.res[id] || 0);

/* ══ weapons ═════════════════════════════════════════════════════════════

    .filter(i => i.type === "Weapon" && i.damage)
    .map(i => {

      const mod = finesse
        ? Math.max(ability("str").mod, ability("dex").mod) : ability("str").mod;
      const magic = i.magicBonus || 0;
      const riders = (i.riders || []).map(r => ({...r, dragon:/dragon/i.test(r.when)}));
      return {
        id: i.id, name: i.name, base: i.originalName, dice: i.damage,
        type: i.damageType, mod, magic, riders,
        toHit: mod + D.profBonus + magic,
        crit: /Improved Critical/i.test(i.note || "") ? 18 : 20,
        note: i.note, props: i.properties || [],
        reach: (i.properties||[]).includes("Reach"),
        // The Dragonlance grants advantage against dragons on top of its rider.
        dragonAdv: riders.some(r => r.dragon),
      };
    })
    .sort((a, b) => (b.magic + b.riders.length * 3) - (a.magic + a.riders.length * 3));
}
const WEAPONS = weapons();

/* ══ dice ════════════════════════════════════════════════════════════════
   Every roll goes through here so the receipt can show individual faces —
   at the table you want to see the d20 and each damage die, not a mean. */
const die = faces => 1 + Math.floor(Math.random() * faces);

/* Parse and roll an expression like "2d8+3", "1d10", "+1d4", "-2".
   `crit` doubles the DICE only, never the flat modifier. */
function rollExpr(expr, {crit = false} = {}) {
  const terms = String(expr || "").replace(/\s+/g, "").match(/[+-]?[^+-]+/g) || [];
  const dice = [];
  let flat = 0, ok = false;
  for (const term of terms) {
    const sign = term.startsWith("-") ? -1 : 1;
    const body = term.replace(/^[+-]/, "");
    const m = /^(\d*)d(\d+)$/i.exec(body);
    if (m) {
      const count = (+m[1] || 1) * (crit ? 2 : 1);
      const faces = +m[2];
      if (!faces || count > 100) continue;
      for (let i = 0; i < count; i++) dice.push({faces, value: die(faces), sign});
      ok = true;
    } else if (/^\d+$/.test(body)) { flat += sign * +body; ok = true; }
  }
  const total = dice.reduce((s, x) => s + x.sign * x.value, 0) + flat;
  return {total, dice, flat, ok};
}

/* d20 with advantage/disadvantage — keeps both faces so the receipt can show
   which one was discarded. */
function rollD20(eff) {
  const faces = eff === 0 ? [die(20)] : [die(20), die(20)];
  const kept = eff === 1 ? Math.max(...faces) : eff === -1 ? Math.min(...faces) : faces[0];
  return {faces, kept, eff};
}

function logRoll(entry) {
  S.rolls = [entry, ...(S.rolls || [])].slice(0, 12);
}

/* A full attack: to-hit, then every damage component rolled individually. */
function rollAttack(w, c, extra = "") {
  const o = outcome(w, c);
  const d20 = rollD20(o.eff);
  const bonus = w.toHit;
  const extraRoll = extra ? rollExpr(extra) : null;
  const toHitExtra = extraRoll && extraRoll.ok ? extraRoll.total : 0;
  const total = d20.kept + bonus + toHitExtra;
  const crit = d20.kept >= w.crit;
  const fumble = d20.kept === 1;
  const hit = !fumble && (crit || total >= c.ac);

  const rows = hit ? o.rows.map(r => {
    const expr = (r.dice || "") + (r.flat ? `+${r.flat}` : "");
    return {src: r.src, roll: rollExpr(expr || "0", {crit: crit && r.doubles})};
  }) : [];
  const damage = rows.reduce((s, r) => s + r.roll.total, 0);
  return {kind:"attack", weapon:w.name, d20, bonus, toHitExtra, total, crit, fumble,
          hit, ac:c.ac, rows, damage, extra};
}

/* ══ damage math ═════════════════════════════════════════════════════════ */
function outcome(w, c) {
  const critNeed = w.crit;
  const hitNeed = clamp(c.ac - w.toHit, 2, 20);
  const pOne = (21 - hitNeed) / 20;                 // any hit, incl. crit
  const pCritOne = (21 - critNeed) / 20;
  const adv = c.adv === "adv" ? 1 : c.adv === "dis" ? -1 : 0;
  // Precise Strike grants advantage on the attack it's spent on, and the
  // Dragonlance grants it against any dragon regardless of size.
  const grants = c.precise || (c.dragon && w.dragonAdv);
  const eff = grants && adv === 0 ? 1 : adv;
  const roll = (p) => eff === 1 ? 1 - (1-p)**2 : eff === -1 ? p*p : p;
  const pHit = roll(pOne), pCrit = roll(pCritOne);
  const pNormal = Math.max(0, pHit - pCrit);

  const rows = [];
  const push = (src, dice, flat, doubles) =>
    rows.push({src, dice, flat: flat||0, avg: avg(dice) + (flat||0), doubles: doubles !== false});

  push(`${w.name} ${w.dice}`, w.dice, w.mod + w.magic);
  push(`Radiant Strikes ${RADIANT}`, RADIANT, 0);
  if (c.smite > 0) {
    // 2d8 at 1st level, +1d8 per slot level above that, capped at 5d8, then
    // +1d8 vs Undead or Fiend. A 4th-level slot already reaches the cap.
    const n = Math.min(c.smite + 1, 5) + (c.undead ? 1 : 0);
    push(`Divine Smite ${n}d8`, `${n}d8`, 0);
  }
  if (c.precise) push("Precise Strike 1d8", "1d8", 0);
  if (c.charge)  push("Charge Attack 1d8", "1d8", 0);
  if (c.dragon) for (const r of w.riders.filter(x => x.dragon))
    push(`${w.name} vs dragons ${r.dice} ${r.damageType}`, r.dice, 0);

  const onHit  = rows.reduce((t, r) => t + r.avg, 0);
  const onCrit = rows.reduce((t, r) => t + (r.doubles ? r.avg + avg(r.dice) : r.avg), 0);
  const expect = pNormal * onHit + pCrit * onCrit;
  return {rows, pHit, pCrit, pNormal, onHit, onCrit, expect, hitNeed, critNeed, eff};
}

function laneOptions(lane) {
  const fromExport = DATA.actions
    .filter(LANES.find(l => l.id === lane).match)
    .map(a => ({name:a.name, meta:[a.dice, a.limitedUse
      ? `${resLeftFor(a)} left` : null].filter(Boolean).join(" · ") || "—",
      spent: a.limitedUse ? resLeftFor(a) === 0 : false}));
  return [...(EXTRA[lane] || []), ...fromExport];
}
function resLeftFor(a) {
  const r = RESOURCES.find(x => x.from === a.name);
  if (r) return resLeft(r.id);
  return a.limitedUse ? a.limitedUse.max - a.limitedUse.used : 0;
}

/* Which resources a planned round would consume. */
function forecast() {
  const cost = {slots:0, slotLevel:0, res:{}};
  const picks = Object.values(S.plan).filter(Boolean);
  for (const p of picks) {
    const r = RESOURCES.find(x => x.from === p);
    if (r) cost.res[r.id] = (cost.res[r.id] || 0) + 1;
  }
  // A smite rides an attack, so a play whose action lane is an attack still costs a
  // slot even though "Divine Smite" never occupies a lane of its own.
  const swinging = picks.some(p => /^Attack \(|Charge Attack|Divine Smite/.test(p));
  if (swinging && S.calc.smite > 0) {
    cost.slots = 1; cost.slotLevel = S.calc.smite;
  }
  if (swinging && S.calc.precise) cost.res.precise = (cost.res.precise || 0) + 1;
  return cost;
}

/* ══ live campaign data — Notion ══════════════════════════════════════════
   Read through the viewer's own Notion connector; nothing is baked in. The
   page renders fully without it and each panel degrades on its own. */
const NOTION_SERVER = "Notion";
const NOTION_PAGES = [
  {key:"arc",      id:"7b2bf3b8-5f92-4e69-a834-a9e4d326de90",
   label:"Gameplay Reference", note:"the 🔄 arc block"},
  {key:"overview", id:"1906e274-cf6f-4a4a-9fb0-ac0a8c198f17",
   label:"Overview", note:"threads and quests"},
  {key:"story",    id:"30570c42-5763-4fc1-bd2b-500ffc052420",
   label:"The Story So Far", note:"campaign recap"},
];

const notion = {
  available: null,          // null = not yet determined
  live: {},                 // key -> {text, storedAt, revalidating}
  errors: {},               // key -> McpError
  subs: [],
};

/* Distinct copy per error code — the contract's central rule is never to
   collapse these, because each one has a different fix. */
function notionFix(err) {
  switch (err && err.code) {
    case "needs_reauth": return {
      head:"Notion needs reconnecting",
      body:"Your Notion connection lapsed. Reconnect it in claude.ai Settings → Connectors, then reload.", retry:false};
    case "server_not_connected": return {
      head:"No Notion connector",
      body:"Add Notion in claude.ai Settings → Connectors to pull the campaign in live.", retry:false};
    case "selection_required": return {
      head:"Choose a Notion workspace",
      body:"You have more than one Notion connector. Pick which to use when claude.ai prompts, then reload.", retry:false};
    case "blocked_by_policy": return {
      head:"Blocked by policy",
      body:"Your organization blocks this Notion tool for artifacts.", retry:false};
    case "approval_required": return {
      head:"Needs approval",
      body:"This Notion tool requires per-call approval, which artifacts can't request yet.", retry:false};
    case "not_in_manifest": return {
      head:"Not permitted",
      body:"This page didn't ask for the Notion tool it just tried to use.", retry:false};
    case "not_granted": case "capability_disabled": case "capability_removed": return {
      head:"Live data unavailable here",
      body:"This view can't reach connectors. Everything else on the sheet still works.", retry:false};
    case "server_unavailable": case "rate_limited": return {
      head:"Notion didn't answer",
      body:"Temporary — the campaign panels will fill in on the next refresh.", retry:true};
    case "tool_error": return {
      head:"Notion rejected the request",
      body:(err.message || "The page may have moved or been deleted."), retry:false};
    default: return {
      head:"Couldn't reach Notion",
      body:(err && err.message) || "Unknown error.", retry:true};
  }
}
/* Authz denials must retract rendered data; transient errors keep last-good. */
const RETRACTS = new Set(["needs_reauth","server_not_connected","blocked_by_policy",
                          "approval_required","not_granted","capability_disabled",
                          "capability_removed","not_in_manifest"]);

async function startNotion() {
  if (!window.claude || !window.claude.mcp) { notion.available = false; render(); return; }
  notion.available = true;

  /* Resolve the connector by the tool it exposes rather than trusting a
     hard-coded display name. listTools() returns this frame's manifest
     intersected with the viewer's actual connectors, so an empty match means
     they genuinely have no Notion connector — say that instead of failing
     three times with a confusing error. */
  let server = NOTION_SERVER;
  try {
    const res = await window.claude.mcp.listTools();
    const servers = (res && res.servers) || [];
    const match = servers.find(s => (s.tools || []).some(t => t.name === "notion-fetch"))
               || servers.find(s => /notion/i.test(s.server));
    if (match) {
      server = match.server;
      if (match.authStatus === "needs_reauth")
        for (const p of NOTION_PAGES) notion.errors[p.key] = {code:"needs_reauth"};
    } else {
      for (const p of NOTION_PAGES) notion.errors[p.key] = {code:"server_not_connected"};
      render();
      return;
    }
  } catch (e) {
    // listTools is advisory; fall through and let the watches report the real error.
  }
  notion.server = server;

  for (const page of NOTION_PAGES) {
    try {
      const un = window.claude.mcp.watchTool(
        server, "notion-fetch", {id: page.id},
        ev => {
          if (ev.type === "data") {
            const r = ev.result || {};
            const p = r.payload;
            const text = typeof p === "string" ? p : (p && p.text) || "";
            notion.live[page.key] = {
              text,
              title: (p && p.title) || page.label,
              url: (p && p.url) || null,
              storedAt: r.cache ? r.cache.storedAt : null,
              revalidating: !!(r.cache && r.cache.revalidating),
            };
            delete notion.errors[page.key];
          } else {
            notion.errors[page.key] = ev.error || {code:"upstream_error"};
            if (RETRACTS.has(ev.error && ev.error.code)) delete notion.live[page.key];
          }
          render();
        },
        {cache:{staleTime:120000}, refetchInterval:300000});
      notion.subs.push(un);
    } catch (e) {
      notion.errors[page.key] = {code:"bad_request", message:String(e && e.message || e)};
    }
  }
}

function refreshNotion() {
  if (!window.claude || !window.claude.mcp || !window.claude.mcp.invalidate) return;
  window.claude.mcp.invalidate(notion.server || NOTION_SERVER, "notion-fetch")
    .catch(() => {});
}

/* ── Notion-flavored markdown → safe HTML (inline only) ─────────────────── */
function nmd(s) {
  return esc(String(s || ""))
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\\([\\`*_~])/g, "$1")
    .replace(/&lt;mention-page url=&quot;[^&]*&quot;\/&gt;/g, "")
    .replace(/&lt;[^&]*&gt;/g, "");
}

/* Pull the 🔄 situational callout the campaign notes keep at the top. */
function arcBullets(text) {
  const m = /<callout icon="🔄"[^>]*>([\s\S]*?)<\/callout>/.exec(text || "");
  if (!m) return null;
  const lines = m[1].split("\n").map(l => l.replace(/^\t+/, "").trim()).filter(Boolean);
  const head = lines.length && !lines[0].startsWith("·") ? lines.shift() : null;
  return {head, bullets: lines.filter(l => l.startsWith("·")).map(l => l.slice(1).trim())};
}

/* Section headed by a `## Title` or `### Title` line, up to the next heading. */
function nSection(text, re) {
  const lines = String(text || "").split("\n");
  const i = lines.findIndex(l => re.test(l));
  if (i < 0) return null;
  const out = [];
  for (let j = i + 1; j < lines.length; j++) {
    if (/^#{1,3}\s/.test(lines[j].trim())) break;
    out.push(lines[j]);
  }
  return out.join("\n").trim();
}

function freshness(entry) {
  if (!entry) return "";
  if (entry.revalidating) return "refreshing…";
  if (!entry.storedAt) return "just now";
  const mins = Math.round((nowMs() - entry.storedAt) / 60000);
  return mins < 1 ? "just now" : mins < 60 ? `${mins}m ago`
    : `${Math.round(mins/60)}h ago`;
}
const nowMs = () => Date.now();

/* One live panel: header with a state dot, body from the render fn. */
function livePanel({key, title, render: body, empty}) {
  const entry = notion.live[key], err = notion.errors[key];
  const box = el("div", "arc");
  const dot = err ? (RETRACTS.has(err.code) ? "off" : "stale") : entry ? "" : "off";
  let inner;
  if (entry) {
    inner = body(entry) || `<span style="color:var(--text-3)">${esc(empty)}</span>`;
  } else if (err) {
    const f = notionFix(err);
    inner = `<b>${esc(f.head)}</b><br>${esc(f.body)}`;
  } else if (notion.available === false) {
    inner = `<b>Live data unavailable here</b><br>This view can't reach connectors.
             Everything else on the sheet still works.`;
  } else {
    inner = `<span style="color:var(--text-3)">Reading Notion…</span>`;
  }
  box.innerHTML = `
    <div class="arc-h"><span class="live-dot ${dot}"></span><span class="t">${esc(title)}</span>
      ${entry && entry.url
        ? `<a class="link-out" style="font-size:11px" href="${esc(entry.url)}"
             target="_blank" rel="noopener">open in Notion</a>` : ""}
      <span class="age">${entry ? esc(freshness(entry)) : ""}</span>
      ${(err && notionFix(err).retry) || entry
        ? `<button class="retry" data-notion-refresh>Refresh</button>` : ""}
    </div>
    <div class="arc-b">${inner}</div>`;
  return box;
}

/* ══ render: turn planner ════════════════════════════════════════════════ */

  for (const r of RESOURCES) {

      <div class="togs">

            w.dragonAdv ? "advantage + 3d6 force" : "no rider on this weapon"],

/* Faces as chips; a discarded advantage/disadvantage die is struck through. */
function faceChips(values, keptIndex) {
  return values.map((v, i) =>
    `<span class="face ${keptIndex != null && i !== keptIndex ? "drop" : ""}
      ${v === 20 ? "max" : v === 1 ? "min" : ""}">${v}</span>`).join("");
}

function rollCard(r) {
  if (!r) return "";
  if (r.kind === "simple") {
    return `<div class="receipt">
      <div class="r-head"><span class="r-name">${esc(r.label)}</span>
        <span class="r-total num">${r.roll.total}</span></div>
      <div class="r-line"><span class="r-src">${esc(r.expr)}</span>
        <span class="r-dice">${faceChips(r.roll.dice.map(d => d.value))}${
          r.roll.flat ? `<span class="flat">${sgn(r.roll.flat)}</span>` : ""}</span></div>
    </div>`;
  }
  const keptIdx = r.d20.faces.indexOf(r.d20.kept);
  const verdict = r.fumble ? "FUMBLE" : r.crit ? "CRIT" : r.hit ? "HIT" : "MISS";
  const cls = r.fumble ? "miss" : r.crit ? "crit" : r.hit ? "hit" : "miss";
  return `<div class="receipt ${cls}">
    <div class="r-head">
      <span class="r-name">${esc(r.weapon)}</span>
      <span class="r-verdict ${cls}">${verdict}</span>
      ${r.hit ? `<span class="r-total num">${r.damage}</span>` : ""}
    </div>
    <div class="r-line">
      <span class="r-src">to hit vs AC ${r.ac}</span>
      <span class="r-dice">${faceChips(r.d20.faces, r.d20.eff === 0 ? null : keptIdx)}
        <span class="flat">+${r.bonus}</span>${
        r.toHitExtra ? `<span class="flat">${sgn(r.toHitExtra)}</span>` : ""}
        <span class="eq num">= ${r.total}</span></span>
    </div>
    ${r.rows.map(row => `<div class="r-line">
      <span class="r-src">${esc(row.src)}</span>
      <span class="r-dice">${faceChips(row.roll.dice.map(d => d.value))}${
        row.roll.flat ? `<span class="flat">${sgn(row.roll.flat)}</span>` : ""}
        <span class="eq num">= ${row.roll.total}</span></span></div>`).join("")}
    ${r.crit ? `<div class="r-note">Damage dice doubled on the crit.</div>` : ""}
    ${!r.hit ? `<div class="r-note">No damage rolled.</div>` : ""}
  </div>`;
}

const lastRollCard = kind => {
  const r = (S.rolls || []).find(x => x.kind === (kind === "attack" ? "attack" : kind));
  return rollCard(r);
};

function poleStrike(c) {
  const w = WEAPONS.find(x => x.reach) || WEAPONS[0];
  const pole = {...w, dice:"1d4"};
  return outcome(pole, {...c, smite:0, precise:false, charge:false});
}

/* What a planned pick rolls, if anything.
   "" means it is an attack (rolled through the weapon), a dice string means a
   plain roll, and null means there is nothing to roll. */
function rollableExpr(pick) {
  if (/^Attack \(/.test(pick) || pick === "Charge Attack") return "";
  const a = actionByName(pick);
  if (a && a.dice) {
    // Weapon-ish riders add the strength modifier; flat riders do not.
    const strAdd = /Pole Strike|Charge/.test(a.name) ? ability("str").mod : 0;
    return a.dice + (strAdd ? `+${strAdd}` : "");
  }
  if (/Save-a-Homie/.test(pick)) return `1d${DATA.defences.hitDice[0].die}`;
  if (/Turn the Tide/.test(pick)) return `1d6+${ability("cha").mod}`;
  if (/Commanding Rally/.test(pick)) return "1d8";
  return null;
}

function rollLane(laneId) {
  const pick = S.plan[laneId];
  if (!pick) return;
  const base = rollableExpr(pick);
  if (base === null) return;
  const mod = (S.laneMod[laneId] || "").trim();

  set(s => {
    let entry;
    if (base === "") {
      // Attacks go through the full weapon pipeline so crits and riders apply.
      const w = WEAPONS[s.calc.weapon] || WEAPONS[0];
      entry = rollAttack(w, {...s.calc, charge: s.calc.charge || pick === "Charge Attack"}, mod);
      entry.weapon = `${w.name} — ${pick}`;
    } else {
      const expr = base + (mod && !/^[+-]/.test(mod) ? `+${mod}` : mod);
      entry = {kind:"simple", label:pick, expr, roll: rollExpr(expr)};
    }
    entry.lane = laneId;
    s.rolls = [entry, ...s.rolls.filter(r => r.lane !== laneId)].slice(0, 12);
  });
}

/* Spend everything the planned round costs — deliberately separate from rolling,
   so you can roll freely and only commit once the round actually happens. */
function commitRound() {
  const cost = forecast();
  set(s => {
    for (const [id, n] of Object.entries(cost.res))
      s.res[id] = clamp((s.res[id] || 0) + n, 0, resMax(id));
    if (cost.slots) {
      const lv = cost.slotLevel;
      const max = (DATA.spellcasting.slots.find(x => x.level === lv) || {max:0}).max;
      s.slots[lv] = clamp((s.slots[lv] || 0) + 1, 0, max);
    }
    s.plan = {action:null, bonus:null, reaction:null, move:null};
    s.laneMod = {action:"", bonus:"", reaction:"", move:""};
    s.rolls = s.rolls.filter(r => !r.lane);
  });
}

function costLine(pick) {
  const r = RESOURCES.find(x => x.from === pick);
  if (r) return `1 ${r.label} · ${resLeft(r.id)} left`;
  if (pick === "Divine Smite") return S.calc.smite
    ? `1 level-${S.calc.smite} slot` : "set a slot in the calculator";
  return "";
}

const REACTIONS = [
  {name:"Reactive Strike", trigger:"A creature enters the 10 ft reach of the Dragonlance. Polearm Master turns entering your reach into the trigger, not leaving it.", cost:"Reaction"},
  {name:"Divine Allegiance", trigger:"A creature within 5 ft takes damage — take it yourself instead. Cannot be reduced or prevented, but your table ruling grants you resistance.", cost:"Reaction"},
  {name:"Save-a-Homie!", trigger:"An ally you can see is targeted by an attack or spell. Move into their space, become the target, expend a Hit Die for AC or save bonus.", cost:"Reaction + 1 Hit Die"},
  {name:"Crownguard", trigger:"An enemy attacks a homie — impose disadvantage. Requires the longsword in hand.", cost:"Reaction"},
  {name:"Dragon Ally", trigger:"After you attack with the Dragonlance, any dragon ally can use its reaction to make an attack.", cost:"Their reaction"},
  {name:"Opportunity Attack", trigger:"A creature you can see leaves your reach.", cost:"Reaction"},
  {name:"Guarded Mind", trigger:"Mage Slayer — shrug off a magical effect you failed a save against.", cost:"1 use · Short Rest", res:"guarded"},
  {name:"Shield", trigger:"You are hit by an attack — +5 AC until your next turn. Prepared via Magic Initiate.", cost:"1st-level slot"},
];

/* ══ render: playbook ════════════════════════════════════════════════════ */
function renderPlaybook() {
  const out = el("div");
  const s = el("section", "stage-sec");
  const used = ["All", ...SITUATIONS.filter(x => PLAYS.some(p => p.situation === x))];
  const h = el("div", null, `<div class="chips" data-plays style="margin-bottom:14px">${
    used.map(x => `<button class="chip ${S.playFilter===x?"on":""}" data-f="${esc(x)}">${esc(x)}</button>`
    ).join("")}</div>`);
  s.append(el("h2", null, "Plays — built from Toki's kit"), h);

  const grid = el("div", "plays");
  for (const p of PLAYS.filter(p => S.playFilter === "All" || p.situation === S.playFilter)) {
    const card = el("article", "play");
    card.innerHTML = `
      <div class="play-h">
        <h3><span class="play-id">${p.icon} ${p.id}</span> ${esc(p.name)}</h3>
        <div class="play-tags">${p.tags.map(t => `<span class="ptag">${esc(t)}</span>`).join("")}</div>
        <div class="loop">${esc(p.loop)}</div>
        <div class="when">${esc(p.when)}</div>
      </div>
      <div class="play-steps">${p.steps.map(st => {
        const cls = {action:"a", bonus:"b", reaction:"r", move:"m", none:"m"}[st.lane];
        const lab = {action:"Action", bonus:"Bonus", reaction:"React", move:"Move", none:"Free"}[st.lane];
        return `<div class="step"><span class="sl ${cls}">${lab}</span>
          <span>${tokens(st.text)}</span></div>`;
      }).join("")}</div>
      ${p.note ? `<div class="play-note">${tokens(p.note)}</div>` : ""}
      <div class="play-f"><span class="cost">${esc(p.cost)}</span>
        ${p.steps.some(s => s.lane !== "none")
          ? `<button class="load" data-load="${p.id}">Load into planner</button>`
          : `<span class="load" style="border-style:dashed;cursor:default;color:var(--text-3);
               border-color:var(--line)">Costs no round</span>`}</div>`;
    grid.append(card);
  }
  s.append(grid);
  out.append(s);
  return out;
}

/* Inline tokens in play text. Step strings carry trusted authored HTML (bold,
   italics), so they are not escaped — only the token payloads are. */
function tokens(html) {
  return String(html)
    .replace(/\[\[use:([a-z]+)\]\]/g, (_, id) => {
      const r = RESOURCES.find(x => x.id === id);
      if (!r) return "";
      const left = resLeft(id);
      return `<button class="tok ${left ? "" : "dry"}" data-spend="${id}"
        title="Spend one ${esc(r.label)} — ${left} of ${r.max} left"
        >${esc(r.label)} <b>${left}/${r.max}</b></button>`;
    })
    .replace(/\[\[slot:(\d)\]\]/g, (_, lv) => {
      const slot = DATA.spellcasting.slots.find(x => x.level === +lv);
      if (!slot) return `<span class="tok dry" title="No level ${lv} slots at Paladin 14">
        L${lv} <b>—</b></span>`;
      const left = slot.max - (S.slots[lv] || 0);
      return `<button class="tok ${left ? "" : "dry"}" data-spend-slot="${lv}"
        title="Spend a level ${lv} slot — ${left} of ${slot.max} left"
        >L${lv} <b>${left}/${slot.max}</b></button>`;
    })
    .replace(/\[\[pool\]\]/g, () => {
      const r = RESOURCES.find(x => x.id === "loh");
      return `<button class="tok" data-spend-pool="5"
        title="Spend 5 from the Lay on Hands pool">Lay on Hands
        <b>${r.max - (S.res.loh||0)}/${r.max}</b></button>`;
    })
    .replace(/\[\[spell:([^\]]+)\]\]/g, (_, name) => {
      const sp = DATA.spells.find(x => x.name === name);
      if (!sp) return `<span class="drift" title="Not on the character sheet at all">
        ${esc(name)} ⚠</span>`;
      return isPrepared(sp)
        ? `<b>${esc(name)}</b>`
        : `<b>${esc(name)}</b> <span class="drift"
             title="Not currently prepared — tick it on the Sheet tab if that changed"
             >not prepared ⚠</span>`;
    })
    .replace(/\[\[drift:([^|\]]+)\|([^\]]+)\]\]/g,
      (_, label, why) => `<span class="drift" title="${esc(why)}">${esc(label)} ⚠</span>`);
}

function loadPlay(id) {
  const p = PLAYS.find(x => x.id === id);
  if (!p) return;
  set(st => {
    st.plan = {action:null, bonus:null, reaction:null, move:null};
    for (const step of p.steps) {
      if (step.lane === "none") continue;
      // First step to claim a lane wins; later same-lane steps are riders on it.
      if (!st.plan[step.lane]) st.plan[step.lane] = step.ref;
    }
    if (p.steps.some(s => s.ref === "Divine Smite") && !st.calc.smite) {
      const top = DATA.spellcasting.slots
        .filter(s => s.max - (st.slots[s.level]||0) > 0).map(s => s.level).pop();
      if (top) st.calc.smite = top;
    }
    st.calc.precise = p.cost.includes("Precise Strike");
    st.calc.charge  = p.steps.some(s => s.ref === "Charge Attack");
    st.calc.mounted = p.tags.includes("Mounted");
    st.calc.dragon  = p.tags.includes("Dragon");
    if (st.calc.dragon) {
      const lance = WEAPONS.findIndex(w => w.dragonAdv);
      if (lance >= 0) st.calc.weapon = lance;
    }
    st.tab = "turn";
  });
}

    <div class="body">${note ? `<div class="note-in">${esc(note)}</div>` : ""}${
      esc(body || "No description in the export.")}${

/* Render a Notion page's prose as a bulleted digest, skipping the structural
   tags the enhanced-markdown format wraps content in. */
function notionLines(text, limit) {
  const skip = /^(<|\{|\}|---|\||#|\[)/;
  const lines = String(text || "").split("\n")
    .map(l => l.replace(/^[\t·\-*\s]+/, "").trim())
    .filter(l => l && !skip.test(l) && l.length > 3)
    .slice(0, limit);
  if (!lines.length) return null;
  return `<ul>${lines.map(l => `<li>${nmd(l)}</li>`).join("")}</ul>`;
}

/* ══ events ══════════════════════════════════════════════════════════════ */
document.addEventListener("click", e => {
  const t = e.target.closest("button, .chip, .pip, .dot, .opt");
  if (!t) return;

  const hp = t.dataset.hp;
  if (hp) {
    const amt = Math.max(0, +document.getElementById("hp-amt").value || 0);
    return set(s => {
      if (hp === "heal") { s.hp = clamp(s.hp + amt, 0, hpMax()); s.death = {ok:0,bad:0}; return; }
      const soak = Math.min(s.temp, amt);   // temporary hit points are spent first
      s.temp -= soak;
      s.hp = clamp(s.hp - (amt - soak), 0, hpMax());
    });
  }

  if (t.hasAttribute("data-temp-set")) {
    const v = Math.max(0, +document.getElementById("temp-set").value || 0);
    return set(s => { s.temp = v; });
  }

  if (t.hasAttribute("data-max-set")) {
    const v = Math.max(0, +document.getElementById("max-set").value || 0);
    return set(s => { s.maxBonus = v; s.hp = Math.min(s.hp, hpMax()); });
  }

  if (t.dataset.grant) {
    const g = t.dataset.grant;
    return set(s => {
      if (g === "clear") {                 // the effect ended: max drops, HP follows it down
        s.maxBonus = 0;
        s.hp = Math.min(s.hp, hpMax());
        return;
      }
      // Aid and Heroes' Feast each raise the maximum AND grant that many hit points.
      const roll = /d/.test(g) ? rollExpr(g) : null;
      const gained = roll ? roll.total : +g;
      s.maxBonus = (s.maxBonus || 0) + gained;
      s.hp = clamp(s.hp + gained, 0, hpMax());
      if (roll) logRoll({kind:"simple", label:"Heroes' Feast", expr:g, roll});
    });
  }

  const pips = t.parentElement?.dataset?.pips;
  if (pips) {
    const i = +t.dataset.i;
    return set(s => {
      if (pips === "hitdice") {
        const total = D.hitDice[0].total;
        s.hitDiceUsed = clamp(total - (i + (t.classList.contains("on") ? 0 : 1)), 0, total);
      } else if (pips.startsWith("slot-")) {
        const lv = +pips.slice(5);
        const max = DATA.spellcasting.slots.find(x => x.level === lv).max;
        s.slots[lv] = clamp(max - (i + (t.classList.contains("on") ? 0 : 1)), 0, max);
      } else {
        const max = resMax(pips);
        s.res[pips] = clamp(max - (i + (t.classList.contains("on") ? 0 : 1)), 0, max);
      }
    });
  }

  const pool = t.parentElement?.dataset?.pool;
  if (pool) {
    const d = +t.dataset.d;
    return set(s => { s.res[pool] = clamp((s.res[pool]||0) + d, 0, resMax(pool)); });
  }

  const death = t.parentElement?.dataset?.death;
  if (death) {
    const i = +t.dataset.i;
    return set(s => {
      s.death[death] = i + (t.classList.contains("on") ? 0 : 1);
    });
  }

  if (t.parentElement?.hasAttribute?.("data-conds")) {
    const c = t.dataset.c;
    return set(s => {
      s.conditions = s.conditions.includes(c)
        ? s.conditions.filter(x => x !== c) : [...s.conditions, c];
    });
  }

  if (t.parentElement?.hasAttribute?.("data-plays"))
    return set(s => { s.playFilter = t.dataset.f; });

  if (t.hasAttribute("data-notion-refresh")) return refreshNotion();

  if (t.dataset.prep) {
    e.preventDefault();                  // don't toggle the <details> underneath
    const n = t.dataset.prep;
    return set(s => { s.prepared[n] = !(s.prepared[n] !== false); });
  }

  if (t.dataset.spend) {
    const id = t.dataset.spend;
    if (!resLeft(id)) return;
    return set(s => { s.res[id] = clamp((s.res[id]||0) + 1, 0, resMax(id)); });
  }
  if (t.dataset.spendSlot) {
    const lv = +t.dataset.spendSlot;
    const slot = DATA.spellcasting.slots.find(x => x.level === lv);
    if (!slot || slot.max - (S.slots[lv]||0) <= 0) return;
    return set(s => { s.slots[lv] = clamp((s.slots[lv]||0) + 1, 0, slot.max); });
  }
  if (t.dataset.spendPool)
    return set(s => { s.res.loh = clamp((s.res.loh||0) + (+t.dataset.spendPool), 0, resMax("loh")); });

  if (t.dataset.roll === "attack") {
    const w = WEAPONS[S.calc.weapon] || WEAPONS[0];
    const mod = (document.getElementById("atk-mod") || {}).value || "";
    return set(s => {
      s.calc.mod = mod;
      const entry = rollAttack(w, s.calc, mod);
      s.rolls = [entry, ...s.rolls.filter(r => r.lane)].slice(0, 12);
    });
  }
  if (t.dataset.rollLane) return rollLane(t.dataset.rollLane);
  if (t.hasAttribute("data-commit")) return commitRound();
  if (t.hasAttribute("data-clear-plan")) return set(s => {
    s.plan = {action:null, bonus:null, reaction:null, move:null};
    s.laneMod = {action:"", bonus:"", reaction:"", move:""};
    s.rolls = s.rolls.filter(r => !r.lane);
  });
  if (t.hasAttribute("data-clear-log")) return set(s => { s.rolls = []; });

  if (t.dataset.load) return loadPlay(t.dataset.load);
  if (t.dataset.clear) return set(s => { s.plan[t.dataset.clear] = null; });

  const lane = t.parentElement?.dataset?.lane;
  if (lane && t.dataset.pick != null) {
    const v = t.dataset.pick;
    return set(s => { s.plan[lane] = s.plan[lane] === v ? null : v; });
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.lanemod)
    return set(s => { s.laneMod[t.dataset.lanemod] = t.value; });
  if (t.id === "atk-mod") return set(s => { s.calc.mod = t.value; });
  if (t.dataset.tog) return set(s => { s.calc[t.dataset.tog] = t.checked; });
  const map = {"c-ac":["ac",Number], "c-adv":["adv",String],
               "c-sm":["smite",Number], "c-w":["weapon",Number]};
  if (map[t.id]) {
    const [k, cast] = map[t.id];
    return set(s => { s.calc[k] = cast(t.value); });
  }
});

document.getElementById("short-rest").onclick = () => set(s => {
  for (const r of RESOURCES) if (r.reset === "Short Rest") s.res[r.id] = 0;
});
document.getElementById("long-rest").onclick = () => set(s => {
  // Heal to the boosted maximum — Heroes' Feast runs 24 hours and survives a long
  // rest. Durations vary, so the bonus itself is only ever cleared by hand.
  s.hp = hpMax(); s.temp = 0; s.death = {ok:0,bad:0}; s.conditions = [];
  for (const r of RESOURCES) s.res[r.id] = 0;
  for (const k of Object.keys(s.slots)) s.slots[k] = 0;
  s.hitDiceUsed = Math.max(0, s.hitDiceUsed - Math.floor(D.hitDice[0].total / 2));
  s.plan = {action:null, bonus:null, reaction:null, move:null};
});
document.getElementById("reset").onclick = () => {
  if (confirm("Reset every tracker back to the exported values?")) {
    const tab = S.tab; S = blank(); S.tab = tab; save(); render();
  }
};

render();
startNotion();
</script>
