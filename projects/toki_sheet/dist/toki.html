<script>
const DATA = {"exportedAt":"2026-08-07T02:09:04.068Z","source":"dndbeyond-character-v5","identity":{"name":"Toki Ironlung","id":123798538,"url":"https://dndbeyond.com/characters/123798538","level":14,"classes":[{"name":"Paladin","level":14,"subclass":"Oath of the Crown (SCAG)","hitDie":10}],"race":"Human","background":"Knight of Solamnia","backgroundDescription":"Prerequisite: Dragonlance Campaign\n\r\n\r\nYou have trained to be a valorous warrior known as a Knight of Solamnia. Strict rules guide your every action, and you work to uphold them as you strive to defend the weak and oppose evil. Your honor is as important to you as your life.\n\r\n\r\nSkill Proficiencies: Athletics, Survival\n\r\nLanguages: Two of your choice\n\r\nEquipment: An insignia of rank, a deck of cards, a set of common clothes, and a pouch containing 10 gp\n\r\n\r\nFeature: Squire of Solamnia\n\r\nYou gain the Squire of Solamnia feat.\n\r\nIn addition, the Knights of Solamnia provide you free, modest lodging and food at any of their fortresses or encampments.","xp":48000,"inspiration":true,"age":21,"height":"6'4\"","weight":227,"hair":"Dark Brown / Black","eyes":"Green / Grey","skin":"Olive skinned","gender":"Male","faith":"","avatar":"https://www.dndbeyond.com/avatars/46476/726/1581111423-123798538.jpeg?width=150&height=150&fit=crop&quality=95&auto=webp","currencies":{"cp":2000,"sp":4000,"gp":99690,"ep":0,"pp":0}},"abilities":[{"key":"str","name":"Strength","score":20,"mod":5},{"key":"dex","name":"Dexterity","score":18,"mod":4},{"key":"con","name":"Constitution","score":16,"mod":3},{"key":"int","name":"Intelligence","score":10,"mod":0},{"key":"wis","name":"Wisdom","score":14,"mod":2},{"key":"cha","name":"Charisma","score":17,"mod":3}],"saves":[{"key":"str","name":"Strength","proficient":false,"value":9,"aura":3},{"key":"dex","name":"Dexterity","proficient":false,"value":8,"aura":3},{"key":"con","name":"Constitution","proficient":false,"value":7,"aura":3},{"key":"int","name":"Intelligence","proficient":false,"value":4,"aura":3},{"key":"wis","name":"Wisdom","proficient":true,"value":11,"aura":3},{"key":"cha","name":"Charisma","proficient":true,"value":12,"aura":3}],"skills":[{"key":"acrobatics","name":"Acrobatics","ability":"dex","proficient":false,"expertise":false,"value":4},{"key":"animal-handling","name":"Animal Handling","ability":"wis","proficient":false,"expertise":false,"value":2},{"key":"arcana","name":"Arcana","ability":"int","proficient":false,"expertise":false,"value":0},{"key":"athletics","name":"Athletics","ability":"str","proficient":true,"expertise":false,"value":10},{"key":"deception","name":"Deception","ability":"cha","proficient":false,"expertise":false,"value":3},{"key":"history","name":"History","ability":"int","proficient":false,"expertise":false,"value":0},{"key":"insight","name":"Insight","ability":"wis","proficient":false,"expertise":false,"value":2},{"key":"intimidation","name":"Intimidation","ability":"cha","proficient":true,"expertise":false,"value":8},{"key":"investigation","name":"Investigation","ability":"int","proficient":false,"expertise":false,"value":0},{"key":"medicine","name":"Medicine","ability":"wis","proficient":false,"expertise":false,"value":2},{"key":"nature","name":"Nature","ability":"int","proficient":false,"expertise":false,"value":0},{"key":"perception","name":"Perception","ability":"wis","proficient":true,"expertise":true,"value":12},{"key":"performance","name":"Performance","ability":"cha","proficient":false,"expertise":false,"value":3},{"key":"persuasion","name":"Persuasion","ability":"cha","proficient":true,"expertise":false,"value":8},{"key":"religion","name":"Religion","ability":"int","proficient":false,"expertise":false,"value":0},{"key":"sleight-of-hand","name":"Sleight of Hand","ability":"dex","proficient":false,"expertise":false,"value":4},{"key":"stealth","name":"Stealth","ability":"dex","proficient":false,"expertise":false,"value":4},{"key":"survival","name":"Survival","ability":"wis","proficient":true,"expertise":false,"value":7}],"defences":{"ac":22,"acSource":"Plate, +1 + Animated Shield + Cloak of Protection","hpMax":206,"hpRemoved":0,"hpTemp":0,"speed":30,"initiative":9,"profBonus":5,"passivePerception":22,"passiveInvestigation":10,"passiveInsight":12,"hitDice":[{"die":10,"total":14,"used":0}],"deathSaves":{"failCount":0,"successCount":0,"isStabilized":false},"senses":["Darkvision 60 ft.","Blindsight 10 ft."],"climbSpeed":30,"conditions":[]},"spellcasting":{"slots":[{"level":1,"max":4,"used":0,"derived":"class table"},{"level":2,"max":3,"used":0,"derived":"class table"},{"level":3,"max":3,"used":0,"derived":"class table"},{"level":4,"max":1,"used":0,"derived":"class table"}],"preparedMax":11,"dc":16,"attack":8,"ability":"Charisma"},"actions":[{"id":"9414047","source":"class","name":"Lay On Hands: Healing Pool","originalName":null,"note":null,"activation":"Bonus Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"You have a pool of healing power that replenishes when you finish a Long Rest. With that pool, you can restore a total of {{5*classlevel}} HP.","description":"Your blessed touch can heal wounds. You have a pool of healing power that replenishes when you finish a Long Rest. With that pool, you can restore a total number of Hit Points equal to five times your Paladin level.\n\r\nAs a Bonus Action, you can touch a creature (which could be yourself) and draw power from the pool of healing to restore a number of Hit Points to that creature, up to the maximum amount remaining in the pool.\n\r\nYou can also expend 5 Hit Points from the pool of healing power to remove the [condition]Poisoned[/condition] condition from the creature; those points don’t also restore Hit Points to the creature.","limitedUse":{"max":70,"used":0,"reset":"Long Rest","name":null},"attack":false},{"id":"9414048","source":"class","name":"Lay On Hands: Heal","originalName":null,"note":null,"activation":"Bonus Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"As a Bonus Action, you can touch a creature (which could be yourself) and restore a number HP to that creature, up to the maximum amount remaining in the pool.","description":"Your blessed touch can heal wounds. You have a pool of healing power that replenishes when you finish a Long Rest. With that pool, you can restore a total number of Hit Points equal to five times your Paladin level.\n\r\nAs a Bonus Action, you can touch a creature (which could be yourself) and draw power from the pool of healing to restore a number of Hit Points to that creature, up to the maximum amount remaining in the pool.\n\r\nYou can also expend 5 Hit Points from the pool of healing power to remove the [condition]Poisoned[/condition] condition from the creature; those points don’t also restore Hit Points to the creature.","limitedUse":null,"attack":false},{"id":"9414049","source":"class","name":"Lay On Hands: Purify Poison","originalName":null,"note":null,"activation":"Bonus Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"You can expend 5 HP from the pool of healing to remove the Poisoned condition from the creature; those points don’t also restore HP to the creature.","description":"Your blessed touch can heal wounds. You have a pool of healing power that replenishes when you finish a Long Rest. With that pool, you can restore a total number of Hit Points equal to five times your Paladin level.\n\r\nAs a Bonus Action, you can touch a creature (which could be yourself) and draw power from the pool of healing to restore a number of Hit Points to that creature, up to the maximum amount remaining in the pool.\n\r\nYou can also expend 5 Hit Points from the pool of healing power to remove the [condition]Poisoned[/condition] condition from the creature; those points don’t also restore Hit Points to the creature.","limitedUse":null,"attack":false},{"id":"9414050","source":"class","name":"Channel Divinity: Divine Sense","originalName":null,"note":null,"activation":"Bonus Action","range":60,"aoe":null,"aoeType":null,"dice":null,"snippet":"For the next 10 min. or until you have the Incapacitated condition, you know the location of any Celestials, Fiends, and Undead within 60 ft., and you know its creature type. In the same radius, you also detect the presence of any place/object that has been consecrated or desecrated, as with the Hallow spell.","description":"You can channel divine energy directly from the Outer Planes, using it to fuel magical effects. You start with one such effect: Divine Sense, which is described below. Other Paladin features give additional Channel Divinity effect options. Each time you use this class’s Channel Divinity, you choose which effect from this class to create.\n\r\nYou can use this class’s Channel Divinity twice. You regain one of its expended uses when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest. You gain an additional use when you reach Paladin level 11.\n\r\nIf a Channel Divinity effect requires a saving throw, the DC equals the spell save DC from this class’s Spellcasting feature.\n\r\nDivine Sense. As a Bonus Action, you can open your awareness to detect Celestials, Fiends, and Undead. For the next 10 minutes or until you have the [condition]Incapacitated[/condition] condition, you know the location of any creature of those types within 60 feet of yourself, and you know its creature type. Within the same radius, you also detect the presence of any place or object that has been consecrated or desecrated, as with the [spells]Hallow[/spells] spell.","limitedUse":null,"attack":false},{"id":"9489541","source":"class","name":"Channel Divinity","originalName":null,"note":null,"activation":"Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"You can channel energy directly from the Outer Planes to fuel magical effects. Each time you use this class’s Channel Divinity, you can choose which effect to create. You can use this class’s Channel Divinity {{scalevalue}} times per Long Rest, but can regain one expended use after finishing a Short Rest.\r\n\r\nIf your Channel Divinity requires a saving throw, the DC equals your Paladin spell save DC (DC {{savedc:cha}}).","description":"You can channel divine energy directly from the Outer Planes, using it to fuel magical effects. You start with one such effect: Divine Sense, which is described below. Other Paladin features give additional Channel Divinity effect options. Each time you use this class’s Channel Divinity, you choose which effect from this class to create.\n\r\nYou can use this class’s Channel Divinity twice. You regain one of its expended uses when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest. You gain an additional use when you reach Paladin level 11.\n\r\nIf a Channel Divinity effect requires a saving throw, the DC equals the spell save DC from this class’s Spellcasting feature.","limitedUse":{"max":3,"used":0,"reset":"Long Rest","name":null},"attack":false},{"id":"9414051","source":"class","name":"Channel Divinity: Abjure Foes","originalName":null,"note":null,"activation":"Action","range":60,"aoe":null,"aoeType":null,"dice":null,"snippet":"As a Magic action, you can expend on use of this class’s Channel Divinity to overwhelm foes. As you present your Holy Symbol or weapon, you can target up to {{modifier:cha#min:1,unsigned}} creatures that you can see within 60 ft. Each one must make a DC {{savedc:cha}} Wis. saving throw or have the Frightened condition for 1 minute, or until it takes damage.\r\n\r\nWhile Frightened, a target can only do one of the following on its turn: move, take an action, or take a Bonus Action.","description":"As a [action]Magic[/action] action, you can expend one use of this class’s Channel Divinity to overwhelm foes with awe. As you present your Holy Symbol or weapon, you can target a number of creatures equal to your Charisma modifier (minimum of one creature) that you can see within 60 feet of yourself. Each target must succeed on a Wisdom saving throw or have the [condition]Frightened[/condition] condition for 1 minute or until it takes any damage. While Frightened in this way, a target can do only one of the following on its turns: move, take an action, or take a Bonus Action.","limitedUse":null,"attack":false},{"id":"9414052","source":"class","name":"Radiant Strikes","originalName":null,"note":null,"activation":"Action","range":null,"aoe":null,"aoeType":null,"dice":"1d8","snippet":"When you hit a target with an attack roll using a Melee weapon or Unarmed Strike, the target takes an additional 1d8 Radiant damage.","description":"Your strikes now carry supernatural power. When you hit a target with an attack roll using a Melee weapon or an Unarmed Strike, the target takes an extra 1d8 Radiant damage.","limitedUse":null,"attack":true},{"id":"9414053","source":"class","name":"Lay on Hands: Restoring Touch","originalName":null,"note":null,"activation":"Bonus Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"When you use Lay on Hands on a creature, you can also remove one or more of the following conditions, expending 5 Hit Points from the healing point for each one removed: Blinded, Charmed, Deafened, Frightened, Paralyzed, or Stunned. The points spent removing the conditions don't also restore HP to the creature.","description":"When you use Lay On Hands on a creature, you can also remove one or more of the following conditions from the creature: [condition]Blinded[/condition], [condition]Charmed[/condition], [condition]Deafened[/condition], [condition]Frightened[/condition], [condition]Paralyzed[/condition], or [condition]Stunned[/condition]. You must expend 5 Hit Points from the healing pool of Lay On Hands for each of these conditions you remove; those points don’t also restore Hit Points to the creature.","limitedUse":null,"attack":false},{"id":"11522181","source":"class","name":"Initiate a Circle Spell","originalName":null,"note":null,"activation":"Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"You take a Magic action to initiate casting a Circle spell. When you do so, choose which Circle casting option you’re using for this casting; you must also meet any of the other requirements described in that option’s text. Until the Circle spell’s casting is complete, you must maintain Concentration on the spell.","description":"You take a Magic action to initiate casting a Circle spell. When you do so, choose which Circle casting option you’re using for this casting; you must also meet any of the other requirements described in that option’s text. Until the Circle spell’s casting is complete, you must maintain Concentration on the spell.","limitedUse":null,"attack":false},{"id":"11522200","source":"class","name":"Circle Spell: Augment","originalName":null,"note":null,"activation":"Special","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"When you cast a spell with a range of at least 5 ft., you can increase the range of the spell by 1,000 ft. per secondary caster contributing to the spell, up to a max of a 1-mile increase.","description":"When you cast a spell with a range of at least 5 feet, you can increase the range of the spell by 1,000 feet per secondary caster contributing to the spell, up to a maximum of a 1-mile increase.","limitedUse":null,"attack":false},{"id":"11522211","source":"class","name":"Circle Spell: Distribute","originalName":null,"note":null,"activation":"Special","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"When you cast a spell that requires Concentration, you can distribute the mental load of the spell among you and the secondary casters. Once the casting is complete, you and all secondary casters can maintain Concentration on this spell. As long as at least one caster who contributed to the spell maintains this Concentration, the spell’s effects remain active.","description":"When you cast a spell that requires Concentration, you can distribute the mental load of the spell among you and the secondary casters. Once the casting is complete, you and all secondary casters can maintain Concentration on this spell. As long as at least one caster who contributed to the spell maintains this Concentration, the spell’s effects remain active.","limitedUse":null,"attack":false},{"id":"11522221","source":"class","name":"Circle Spell: Expand","originalName":null,"note":null,"activation":"Special","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"When you cast a spell that creates an area of effect, you can increase one dimension of the spell’s area of effect for this casting by 10 ft. per secondary caster contributing to the spell. \r\n\r\nEach secondary caster contributing to the spell must expend a spell slot (no action required). If the spell fails, these spell slots aren’t expended.","description":"When you cast a spell that creates an area of effect, you can increase one dimension of the spell’s area of effect for this casting by 10 feet per secondary caster contributing to the spell. For example, if a spell creates a 20-foot-radius Sphere, casting it as a Circle spell with two secondary casters would increase the radius to 40 feet. A spell that creates a Line that is 5 feet wide and 300 feet long, cast as a Circle spell with two secondary casters, could make a Line that is either 25 feet wide or 320 feet long.\n\r\nEach secondary caster contributing to the spell must expend a spell slot (no action required). If the spell fails, these spell slots aren’t expended.","limitedUse":null,"attack":false},{"id":"11522269","source":"class","name":"Circle Spell: Prolong","originalName":null,"note":null,"activation":"Special","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"When you cast a spell that has a duration of 1 min or longer, you can increase the duration of the spell depending on the number of secondary casters contributing to the spell.\r\n\r\nEach secondary caster contributing to the spell must expend a spell slot (no action required). If the spell fails, these spell slots aren’t expended.","description":"When you cast a spell that has a duration of 1 minute or longer, you can increase the duration of the spell depending on the number of secondary casters contributing to the spell, as detailed in the table below.\n\r\nEach secondary caster contributing to the spell must expend a spell slot (no action required). If the spell fails, these spell slots aren’t expended.\n\r\n\r\nSpell Duration\n\r\n\r\n\r\n\r\nSecondary Casters\r\nThe Spell Increases Duration by\r\n\n\r\n\r\n\r\n\r\n1–3\r\n1 hour\r\n\n\r\n\r\n4–6\r\n8 hours\r\n\n\r\n\r\n7+\r\n24 hours","limitedUse":null,"attack":false},{"id":"11522283","source":"class","name":"Circle Spell: Safeguard","originalName":null,"note":null,"activation":"Special","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"When you cast a spell that creates an area of effect, you can carve out a safe zone within that area of effect that is unaffected by the spell for its duration. This safe zone consists of a number of 5-ft. Cubes equal to {{modifier:cha#unsigned}} + the number of secondary casters contributing to the spell (min of 1 Cube). You can arrange the Cubes as you like, but each Cube must be contiguous with at least one other Cube.\r\n\r\nIf the spell’s area of effect can be moved, the safe zone moves with it.","description":"When you cast a spell that creates an area of effect, you can carve out a safe zone within that area of effect that is unaffected by the spell for its duration. This safe zone consists of a number of 5-foot Cubes equal to your spellcasting ability modifier plus the number of secondary casters contributing to the spell (minimum of one Cube). You can arrange the Cubes as you like, but each Cube must be contiguous with at least one other Cube.\n\r\nIf the spell’s area of effect can be moved, the safe zone moves with it.","limitedUse":null,"attack":false},{"id":"11522294","source":"class","name":"Circle Spell: Supplant","originalName":null,"note":null,"activation":"Special","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"When you cast a spell that requires at least one Material component with a specified cost that is consumed by the spell, you can reduce the min cost of one such Material component by 50 GP per each secondary caster contributing to the spell.\r\n\r\nEach secondary caster contributing to the spell must expend a spell slot of a level greater than or equal to the spell’s level (no action required). If the spell fails, these spell slots aren’t expended.","description":"When you cast a spell that requires at least one Material component with a specified cost that is consumed by the spell, you can reduce the minimum cost of one such Material component by 50 GP per each secondary caster contributing to the spell. For example, casting [spells]Revivify[/spells] as a Circle spell with two secondary casters would reduce the Material component’s minimum cost to 200 GP.\n\r\nEach secondary caster contributing to the spell must expend a spell slot of a level greater than or equal to the spell’s level (no action required). If the spell fails, these spell slots aren’t expended.","limitedUse":null,"attack":false},{"id":"9414430","source":"class","name":"Channel Divinity: Champion Challenge","originalName":null,"note":null,"activation":"Bonus Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"As a bonus action, each creature of your choice within 30 ft. must make a WIS saving throw (DC {{savedc:cha}}) or it can't willingly move more than 30 ft. away from you.","description":"As a bonus action, you issue a challenge that compels other creatures to do battle with you. Each creature of your choice that you can see within 30 feet of you must make a Wisdom saving throw. On a failed save, a creature can’t willingly move more than 30 feet away from you. This effect ends on the creature if you are [condition]incapacitated[/condition] or die or if the creature is more than 30 feet away from you.","limitedUse":null,"attack":false},{"id":"9414431","source":"class","name":"Channel Divinity: Turn the Tide","originalName":null,"note":"Targets within 30ft can also use the Healing Surge feature.","activation":"Bonus Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"As a bonus action, each creature of your choice within 30 ft. regains 1d6{{modifier:cha@min:1}} HP if it has no more than half its max HP.","description":"As a bonus action, you can bolster injured creatures with your Channel Divinity. Each creature of your choice that can hear you within 30 feet of you regains hit points equal to 1d6 + your Charisma modifier (minimum of 1) if it has no more than half of its hit points.","limitedUse":null,"attack":false},{"id":"9414432","source":"class","name":"Divine Allegiance","originalName":null,"note":"I gain resistance to the damage taken from this feature.","activation":"Reaction","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"When a creature within 5 ft. of you takes damage, you can use your reaction to take the damage yourself instead. This damage to you can’t be reduced or prevented in any way.","description":"","limitedUse":null,"attack":false},{"id":"9413966","source":"feat","name":"Improved Dash","originalName":null,"note":null,"activation":"Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"When you Dash, your Speed increases by 10 ft. for that action.","description":"When you take the Dash action, your Speed increases by 10 feet for that action.","limitedUse":null,"attack":false},{"id":"9413967","source":"feat","name":"Charge Attack","originalName":null,"note":null,"activation":"Action","range":null,"aoe":null,"aoeType":null,"dice":"1d8","snippet":"As part of a melee attack action, if you move at least 10 feet in a straight line toward the target prior to hitting it, choose one of the following effects: gain 1d8 bonus to the attack's damage, or push the target up to 10 ft. away if it is no more than one size larger than you. You can use this once per turn.","description":"If you move at least 10 feet in a straight line toward a target immediately before hitting it with a melee attack roll as part of the Attack action, choose one of the following effects: gain a 1d8 bonus to the attack’s damage roll, or push the target up to 10 feet away if it is no more than one size larger than you. You can use this benefit only once on each of your turns.","limitedUse":null,"attack":true},{"id":"9921488","source":"feat","name":"Guarded Mind","originalName":null,"note":null,"activation":"Special","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"Once per Short/Long Rest, if you fail an Int., Wis. or Cha. saving throw, you can cause yourself to succeed instead.","description":"General Feat (Prerequisite: Level 4+)\n\r\nYou gain the following benefits.\n\r\nAbility Score Increase. Increase your Strength or Dexterity score by 1, to a maximum of 20.\n\r\nConcentration Breaker. When you damage a creature that is concentrating, it has Disadvantage on the saving throw it makes to maintain [rules]Concentration[/rules].\n\r\nGuarded Mind. If you fail an Intelligence, a Wisdom, or a Charisma saving throw, you can cause yourself to succeed instead. Once you use this benefit, you can’t use it again until you finish a Short or Long Rest.","limitedUse":{"max":1,"used":0,"reset":"Short Rest","name":null},"attack":false},{"id":"9413976","source":"feat","name":"Quick Search","originalName":null,"note":null,"activation":"Bonus Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"You can take the Search action as a Bonus Action.","description":"You can take the Search action as a Bonus Action.","limitedUse":null,"attack":false},{"id":"9413978","source":"feat","name":"Pole Strike","originalName":null,"note":null,"activation":"Bonus Action","range":null,"aoe":null,"aoeType":null,"dice":"1d4","snippet":"Immediately after you attack with a Quarterstaff, a Spear, or a weapon with the Heavy and Reach properties, you can use a Bonus Action to make a melee attack. This deals 1d4 Bludgeoning damage.","description":"Immediately after you take the Attack action and attack with a Quarterstaff , a Spear, or a weapon that has the Heavy and Reach properties, you can use a Bonus Action to make a melee attack with the opposite end of the weapon. The weapon deals Bludgeoning damage, and the weapon’s damage die for this attack is a d4.","limitedUse":null,"attack":true},{"id":"9413979","source":"feat","name":"Reactive Strike","originalName":null,"note":null,"activation":"Reaction","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"While holding a a Quarterstaff, a Spear, or a weapon with the Heavy and Reach properties, you can take a Reaction to make one melee attack against a creature that enters into that weapon's reach.","description":"While you’re holding a Quarterstaff, a Spear, or a weapon that has the Heavy and Reach properties, you can take a Reaction to make one melee attack against a creature that enters the reach you have with that weapon.","limitedUse":null,"attack":false},{"id":"6223272","source":"feat","name":"Knight of the Crown: Commanding Rally","originalName":null,"note":null,"activation":"Bonus Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"As a bonus action, you can command one ally within 30 ft. of yourself to attack. If that ally can see or hear you, they can immediately make one weapon attack as a reaction. If the attack hits, the ally can roll a d8 and add the number rolled as a bonus to the attack’s damage roll. You can use this bonus action {{proficiency#unsigned}} times per long rest.","description":"You are a Knight of Solamnia aligned with the Order of the Crown, a group that extols the virtues of cooperation, loyalty, and obedience. You excel in group combat and gain these benefits:\n\r\nAbility Score Increase. Increase your Strength, Dexterity, or Constitution score by 1, to a maximum of 20.\n\r\nCommanding Rally. As a bonus action, you can command one ally within 30 feet of yourself to attack. If that ally can see or hear you, they can immediately make one weapon attack as a reaction. If the attack hits, the ally can roll a d8 and add the number rolled as a bonus to the attack’s damage roll. You can use this bonus action a number of times equal to your proficiency bonus, and you regain all expended uses when you finish a long rest.","limitedUse":{"max":5,"used":0,"reset":"Long Rest","name":null},"attack":false},{"id":"6223273","source":"feat","name":"Squire of Solamnia: Precise Strike","originalName":null,"note":null,"activation":"Special","range":null,"aoe":null,"aoeType":null,"dice":"1d8","snippet":"Once per turn, when you make a weapon attack roll against a creature, you can cause the attack roll to have advantage. If the attack hits, you roll a d8 and add the number rolled as a bonus to the attack’s damage roll. You can use this benefit {{proficiency#unsigned}} times per long rest, but a use is expended only if the attack hits.","description":"Your training in the ways of the Knights of Solamnia grants you these benefits:\n\r\nMount Up. Mounting or dismounting costs you only 5 feet of movement.\n\r\nPrecise Strike. Once per turn, when you make a weapon attack roll against a creature, you can cause the attack roll to have advantage. If the attack hits, you roll a d8 and add the number rolled as a bonus to the attack’s damage roll. You can use this benefit a number of times equal to your proficiency bonus, but a use is expended only if the attack hits. You regain all expended uses when you finish a long rest.","limitedUse":{"max":5,"used":0,"reset":"Long Rest","name":null},"attack":true},{"id":"10768311","source":"feat","name":"Save-a-Homie!","originalName":null,"note":null,"activation":"Reaction","range":null,"aoe":null,"aoeType":null,"dice":"1d10","snippet":"Save the homie! Move them out of the way, roll a d10 and raise their or your AC or Saving Throws by that number.","description":"As a Reaction, when a creature you can see is targeted by an attack or spell, you can move up to your speed ending your movement in the creature's space you can see, including where you were just standing, provided the creature is willing and isn't incapacitated. The movement does not provoke opportunity attacks. You the become the target of the triggering attack or spell. Before the triggering attack or spell is resolved, you can expend on Hit Die. roll the hit die. Until the start of your next turn you or the other creature gain a bonus to AC or saving throws equal to the number rolled.","limitedUse":null,"attack":false},{"id":"9414139","source":"feat","name":"Bolstering Performance","originalName":null,"note":null,"activation":"No Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"After a Short or Long Rest, give a performance. When you do, up to six allies (which can include yourself) within 30 ft. of yourself gain {{characterlevel+modifier:cha#unsigned}} Temporary HP.","description":"When you finish a Short or Long Rest, you can give an inspiring performance: a speech, song, or dance. When you do so, choose up to six allies (which can include yourself) within 30 feet of yourself who witness the performance. The chosen creatures each gain [rules]Temporary Hit Points[/rules] equal to your character level plus your Charisma modifier.","limitedUse":null,"attack":false},{"id":"9414113","source":"feat","name":"Sap (Longsword)","originalName":null,"note":null,"activation":"Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"Sap. If you hit a creature with a Longsword, that creature has Disadvantage on its next attack roll before the start of your next turn.","description":"Your training with weapons allows you to use the mastery property of Longswords:\n\r\nSap. If you hit a creature with a Longsword, that creature has Disadvantage on its next attack roll before the start of your next turn.","limitedUse":null,"attack":false},{"id":"9414110","source":"feat","name":"Push (Pike)","originalName":null,"note":null,"activation":"Action","range":null,"aoe":null,"aoeType":null,"dice":null,"snippet":"Push. If you hit a creature with Pike, you can push the creature up to 10 ft. straight away from you if it’s Large or smaller.","description":"Your training with weapons allows you to use the mastery property of Pikes:\n\r\nPush. If you hit a creature with Pike, you can push the creature up to 10 feet straight away from yourself if it is Large or smaller.","limitedUse":null,"attack":false},{"id":"custom-6946787","source":"custom","name":"Healing Surge","activation":"—","description":"Heal for up to half of your hit dice","snippet":"Heal using Hit Dice","dice":null,"limitedUse":null,"attack":true}],"spells":[{"name":"Light","level":0,"school":"Evocation","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":"Touch","duration":1,"durationUnit":"Hour","components":"a firefly or phosphorescent moss","componentIds":[1,3],"snippet":"","description":"You touch one Large or smaller object that isn’t being worn or carried by someone else. Until the spell ends, the object sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. The light can be colored as you like.\n\r\nCovering the object with something opaque blocks the light. The spell ends if you cast it again.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Resistance","level":0,"school":"Abjuration","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":true,"castingTime":"Action","range":"Touch","duration":1,"durationUnit":"Minute","components":"","componentIds":[1,2],"snippet":"","description":"You touch a willing creature and choose a damage type: Acid, Bludgeoning, Cold, Fire, Lightning, Necrotic, Piercing, Poison, Radiant, Slashing, or Thunder. When the creature takes damage of the chosen type before the spell ends, the creature reduces the total damage taken by 1d4. A creature can benefit from this spell only once per turn.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Spare the Dying","level":0,"school":"Necromancy","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":15,"duration":0,"durationUnit":null,"components":"","componentIds":[1,2],"snippet":"","description":"Choose a creature within range that has 0 Hit Points and isn’t dead. The creature becomes Stable.\n\r\nCantrip Upgrade. The range doubles when you reach levels 5 (30 feet), 11 (60 feet), and 17 (120 feet).","atHigherLevels":"The range increases to 30 feet. The range increases to 60 feet. The range increases to 120 feet.","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Bless","level":1,"school":"Enchantment","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":true,"castingTime":"Action","range":30,"duration":1,"durationUnit":"Minute","components":"a Holy Symbol worth 5+ GP","componentIds":[1,2,3],"snippet":"","description":"You bless up to three creatures within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target adds 1d4 to the attack roll or save.\n\r\nUsing a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 1.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Command","level":1,"school":"Enchantment","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":60,"duration":0,"durationUnit":null,"components":"","componentIds":[1],"snippet":"","description":"You speak a one-word command to a creature you can see within range. The target must succeed on a Wisdom saving throw or follow the command on its next turn. Choose the command from these options:\n\r\nApproach. The target moves toward you by the shortest and most direct route, ending its turn if it moves within 5 feet of you.\n\r\nDrop. The target drops whatever it is holding and then ends its turn.\n\r\nFlee. The target spends its turn moving away from you by the fastest available means.\n\r\nGrovel. The target has the Prone condition and then ends its turn.\n\r\nHalt. On its turn, the target doesn’t move and takes no action or Bonus Action.\n\r\nUsing a Higher-Level Spell Slot. You can affect one additional creature for each spell slot level above 1.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Compelled Duel","level":1,"school":"Enchantment","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":true,"castingTime":"Bonus Action","range":30,"duration":1,"durationUnit":"Minute","components":"","componentIds":[1],"snippet":"","description":"You try to compel a creature into a duel. One creature that you can see within range makes a Wisdom saving throw. On a failed save, the target has Disadvantage on attack rolls against creatures other than you, and it can’t willingly move to a space that is more than 30 feet away from you.\n\r\nThe spell ends if you make an attack roll against a creature other than the target, if you cast a spell on an enemy other than the target, if an ally of yours damages the target, or if you end your turn more than 30 feet away from the target.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Cure Wounds","level":1,"school":"Abjuration","source":"class-prepared","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":"Touch","duration":0,"durationUnit":null,"components":"","componentIds":[1,2],"snippet":"","description":"A creature you touch regains a number of Hit Points equal to 2d8 plus your spellcasting ability modifier.\n\r\nUsing a Higher-Level Spell Slot. The healing increases by 2d8 for each spell slot level above 1.","atHigherLevels":"","usesSlot":true,"canPrepare":true,"limitedUse":null},{"name":"Divine Favor","level":1,"school":"Transmutation","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Bonus Action","range":"Self","duration":1,"durationUnit":"Minute","components":"","componentIds":[1,2],"snippet":"","description":"Until the spell ends, your attacks with weapons deal an extra 1d4 Radiant damage on a hit.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Divine Smite","level":1,"school":"Evocation","source":"class","prepared":true,"alwaysPrepared":true,"ritual":false,"concentration":false,"castingTime":"Which you take immediately after hitting a target with a Melee weapon or an Unarmed Strike","range":"Self","duration":0,"durationUnit":null,"components":"","componentIds":[1],"snippet":"","description":"The target takes an extra 2d8 Radiant damage from the attack. The damage increases by 1d8 if the target is a Fiend or an Undead.\n\r\nUsing a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 1.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":{"max":1,"used":0,"reset":"Long Rest","name":null}},{"name":"Guiding Bolt","level":1,"school":"Evocation","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":120,"duration":1,"durationUnit":"Round","components":"","componentIds":[1,2],"snippet":"","description":"You hurl a bolt of light toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 4d6 Radiant damage, and the next attack roll made against it before the end of your next turn has Advantage.\n\r\nUsing a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 1.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Healing Word","level":1,"school":"Abjuration","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Bonus Action","range":60,"duration":0,"durationUnit":null,"components":"","componentIds":[1],"snippet":"","description":"A creature of your choice that you can see within range regains Hit Points equal to 2d4 plus your spellcasting ability modifier.\n\r\nUsing a Higher-Level Spell Slot. The healing increases by 2d4 for each spell slot level above 1.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":{"max":1,"used":0,"reset":"Long Rest","name":null}},{"name":"Protection from Evil and Good","level":1,"school":"Abjuration","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":true,"castingTime":"Action","range":"Touch","duration":10,"durationUnit":"Minute","components":"a flask of Holy Water worth 25+ GP, which the spell consumes","componentIds":[1,2,3],"snippet":"","description":"Until the spell ends, one willing creature you touch is protected against creatures that are Aberrations, Celestials, Elementals, Fey, Fiends, or Undead. The protection grants several benefits. Creatures of those types have Disadvantage on attack rolls against the target. The target also can’t be possessed by or gain the Charmed or Frightened conditions from them. If the target is already possessed, Charmed, or Frightened by such a creature, the target has Advantage on any new saving throw against the relevant effect.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Searing Smite","level":1,"school":"Evocation","source":"class-prepared","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"which you take immediately after hitting a target with a Melee weapon or an Unarmed Strike","range":"Self","duration":1,"durationUnit":"Minute","components":"","componentIds":[1],"snippet":"","description":"As you hit the target, it takes an extra 1d6 Fire damage from the attack. At the start of each of its turns until the spell ends, the target takes 1d6 Fire damage and then makes a Constitution saving throw. On a failed save, the spell continues. On a successful save, the spell ends.\n\r\nUsing a Higher-Level Spell Slot. All the damage increases by 1d6 for each spell slot level above 1.","atHigherLevels":"","usesSlot":true,"canPrepare":true,"limitedUse":null},{"name":"Shield","level":1,"school":"Abjuration","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"which you take when you are hit by an attack roll or targeted by the Magic Missile spell","range":"Self","duration":1,"durationUnit":"Round","components":"","componentIds":[1,2],"snippet":"","description":"An imperceptible barrier of magical force protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from Magic Missile.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Aid","level":2,"school":"Abjuration","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":30,"duration":8,"durationUnit":"Hour","components":"a strip of white cloth","componentIds":[1,2,3],"snippet":"","description":"Choose up to three creatures within range. Each target’s Hit Point maximum and current Hit Points increase by 5 for the duration.\n\r\nUsing a Higher-Level Spell Slot. Each target’s Hit Points increase by 5 for each spell slot level above 2.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Find Steed","level":2,"school":"Conjuration","source":"class","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":30,"duration":0,"durationUnit":null,"components":"","componentIds":[1,2],"snippet":"","description":"You summon an otherworldly being that appears as a loyal steed in an unoccupied space of your choice within range. This creature uses the Otherworldly Steed stat block. If you already have a steed from this spell, the steed is replaced by the new one.\n\r\nThe steed resembles a Large, rideable animal of your choice, such as a horse, a camel, a dire wolf, or an elk. Whenever you cast the spell, choose the steed’s creature type—Celestial, Fey, or Fiend—which determines certain traits in the stat block.\n\r\nCombat. The steed is an ally to you and your allies. In combat, it shares your Initiative count, and it functions as a controlled mount while you ride it (as defined in the rules on mounted combat). If you have the Incapacitated condition, the steed takes its turn immediately after yours and acts independently, focusing on protecting you.\n\r\nDisappearance of the Steed. The steed disappears if it drops to 0 Hit Points or if you die. When it disappears, it leaves behind anything it was wearing or carrying. If you cast this spell again, you decide whether you summon the steed that disappeared or a different one.\n\r\nUsing a Higher-Level Spell Slot. Use the spell slot’s level for the spell’s level in the stat block.\n\r\n\r\nOtherworldly Steed\n\r\nLarge Celestial, Fey, or Fiend (Your Choice), Neutral\n\r\nAC 10 + 1 per spell level\n\r\nHP 5 + 10 per spell level (the steed has a number of Hit Dice [d10s] equal to the spell’s level)\n\r\nSpeed 60 ft., Fly 60 ft. (requires level 4+ spell)\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nMod\r\nSave\r\n\n\r\n\r\n\r\n\r\nSTR\r\n18\r\n+4\r\n+4\r\n\n\r\n\r\nDEX\r\n12\r\n+1\r\n+1\r\n\n\r\n\r\nCON\r\n14\r\n+2\r\n+2\r\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nMod\r\nSave\r\n\n\r\n\r\n\r\n\r\nINT\r\n6\r\n&minus;2\r\n&minus;2\r\n\n\r\n\r\nWIS\r\n12\r\n+1\r\n+1\r\n\n\r\n\r\nCHA\r\n8\r\n&minus;1\r\n&minus;1\r\n\n\r\n\r\n\r\n\n\r\nSenses Passive Perception 11\n\r\nLanguages Telepathy 1 mile (works only with you)\n\r\nCR None (XP 0; PB equals your Proficiency Bonus)\n\r\nTraits\n\r\nLife Bond. When you regain Hit Points from a level 1+ spell, the steed regains the same number of Hit Points if you’re within 5 feet of it.\n\r\nActions\n\r\nOtherworldly Slam. Melee Attack Roll: Bonus equals your spell attack modifier, reach 5 ft. Hit: 1d8 plus the spell’s level of Radiant (Celestial), Psychic (Fey), or Necrotic (Fiend) damage.\n\r\nBonus Actions\n\r\nFell Glare (Fiend Only; Recharges after a Long Rest). Wisdom Saving Throw: DC equals your spell save DC, one creature within 60 feet the steed can see. Failure: The target has the Frightened condition until the end of your next turn.\n\r\nFey Step (Fey Only; Recharges after a Long Rest). The steed teleports, along with its rider, to an unoccupied space of your choice up to 60 feet away from itself.\n\r\nHealing Touch (Celestial Only; Recharges after a Long Rest). One creature within 5 feet of the steed regains a number of Hit Points equal to 2d8 plus the spell’s level.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":{"max":1,"used":0,"reset":"Long Rest","name":null}},{"name":"Lesser Restoration","level":2,"school":"Abjuration","source":"class-prepared","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Bonus Action","range":"Touch","duration":0,"durationUnit":null,"components":"","componentIds":[1,2],"snippet":"","description":"You touch a creature and end one condition on it: Blinded, Deafened, Paralyzed, or Poisoned.","atHigherLevels":"","usesSlot":true,"canPrepare":true,"limitedUse":null},{"name":"Shining Smite","level":2,"school":"Transmutation","source":"class-prepared","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":true,"castingTime":"which you take immediately after hitting a creature with a Melee weapon or an Unarmed Strike","range":"Self","duration":1,"durationUnit":"Minute","components":"","componentIds":[1],"snippet":"","description":"The target hit by the strike takes an extra 2d6 Radiant damage from the attack. Until the spell ends, the target sheds Bright Light in a 5-foot radius, attack rolls against it have Advantage, and it can’t benefit from the Invisible condition.\n\r\nUsing a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 2.","atHigherLevels":"","usesSlot":true,"canPrepare":true,"limitedUse":null},{"name":"Warding Bond","level":2,"school":"Abjuration","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":"Touch","duration":1,"durationUnit":"Hour","components":"a pair of platinum rings worth 50+ GP each, which you and the target must wear for the duration","componentIds":[1,2,3],"snippet":"","description":"You touch another creature that is willing and create a mystic connection between you and the target until the spell ends. While the target is within 60 feet of you, it gains a +1 bonus to AC and saving throws, and it has Resistance to all damage. Also, each time it takes damage, you take the same amount of damage.\n\r\nThe spell ends if you drop to 0 Hit Points or if you and the target become separated by more than 60 feet. It also ends if the spell is cast again on either of the connected creatures.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Zone of Truth","level":2,"school":"Enchantment","source":"feat","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":60,"duration":10,"durationUnit":"Minute","components":"","componentIds":[1,2],"snippet":"","description":"You create a magical zone that guards against deception in a 15-foot-radius Sphere centered on a point within range. Until the spell ends, a creature that enters the spell’s area for the first time on a turn or starts its turn there makes a Charisma saving throw. On a failed save, a creature can’t speak a deliberate lie while in the radius. You know whether a creature succeeds or fails on this save.\n\r\nAn affected creature is aware of the spell and can avoid answering questions to which it would normally respond with a lie. Such a creature can be evasive yet must be truthful.","atHigherLevels":"","usesSlot":false,"canPrepare":false,"limitedUse":null},{"name":"Blinding Smite","level":3,"school":"Evocation","source":"class-prepared","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"which you take immediately after hitting a creature with a Melee weapon or an Unarmed Strike","range":"Self","duration":1,"durationUnit":"Minute","components":"","componentIds":[1],"snippet":"","description":"The target hit by the strike takes an extra 3d8 Radiant damage from the attack, and the target has the Blinded condition until the spell ends. At the end of each of its turns, the Blinded target makes a Constitution saving throw, ending the spell on itself on a success.\n\r\nUsing a Higher-Level Spell Slot. The extra damage increases by 1d8 for each spell slot level above 3.","atHigherLevels":"","usesSlot":true,"canPrepare":true,"limitedUse":null},{"name":"Daylight","level":3,"school":"Evocation","source":"class-prepared","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":60,"duration":1,"durationUnit":"Hour","components":"","componentIds":[1,2],"snippet":"","description":"For the duration, sunlight spreads from a point within range and fills a 60-foot-radius Sphere. The sunlight’s area is Bright Light and sheds Dim Light for an additional 60 feet.\n\r\nAlternatively, you cast the spell on an object that isn’t being worn or carried, causing the sunlight to fill a 60-foot Emanation originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the sunlight.\n\r\nIf any of this spell’s area overlaps with an area of Darkness created by a spell of level 3 or lower, that other spell is dispelled.","atHigherLevels":"","usesSlot":true,"canPrepare":true,"limitedUse":null},{"name":"Dispel Magic","level":3,"school":"Abjuration","source":"class-prepared","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":120,"duration":0,"durationUnit":null,"components":"","componentIds":[1,2],"snippet":"","description":"Choose one creature, object, or magical effect within range. Any ongoing spell of level 3 or lower on the target ends. For each ongoing spell of level 4 or higher on the target, make an ability check using your spellcasting ability (DC 10 plus that spell’s level). On a successful check, the spell ends.\n\r\nUsing a Higher-Level Spell Slot. You automatically end a spell on the target if the spell’s level is equal to or less than the level of the spell slot you use.","atHigherLevels":"(See Description)","usesSlot":true,"canPrepare":true,"limitedUse":null},{"name":"Revivify","level":3,"school":"Necromancy","source":"class-prepared","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":false,"castingTime":"Action","range":"Touch","duration":0,"durationUnit":null,"components":"a diamond worth 300+ GP, which the spell consumes","componentIds":[1,2,3],"snippet":"","description":"You touch a creature that has died within the last minute. That creature revives with 1 Hit Point. This spell can’t revive a creature that has died of old age, nor does it restore any missing body parts.","atHigherLevels":"","usesSlot":true,"canPrepare":true,"limitedUse":null},{"name":"Spirit Guardians","level":3,"school":"Conjuration","source":"class-prepared","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":true,"castingTime":"Action","range":"Self","duration":10,"durationUnit":"Minute","components":"a prayer scroll","componentIds":[1,2,3],"snippet":"","description":"Protective spirits flit around you in a 15-foot Emanation for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish.\n\r\nWhen you cast this spell, you can designate creatures to be unaffected by it. Any other creature’s Speed is halved in the Emanation, and whenever the Emanation enters a creature’s space and whenever a creature enters the Emanation or ends its turn there, the creature must make a Wisdom saving throw. On a failed save, the creature takes 3d8 Radiant damage (if you are good or neutral) or 3d8 Necrotic damage (if you are evil). On a successful save, the creature takes half as much damage. A creature makes this save only once per turn.\n\r\nUsing a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 3.","atHigherLevels":"","usesSlot":true,"canPrepare":true,"limitedUse":null},{"name":"Aura of Life","level":4,"school":"Abjuration","source":"class-prepared","prepared":false,"alwaysPrepared":false,"ritual":false,"concentration":true,"castingTime":"Action","range":"Self","duration":10,"durationUnit":"Minute","components":"","componentIds":[1],"snippet":"","description":"An aura radiates from you in a 30-foot Emanation for the duration. While in the aura, you and your allies have Resistance to Necrotic damage, and your Hit Point maximums can’t be reduced. If an ally with 0 Hit Points starts its turn in the aura, that ally regains 1 Hit Point.","atHigherLevels":"","usesSlot":true,"canPrepare":true,"limitedUse":null}],"inventory":[{"id":"943892975","name":"Animated Shield","originalName":null,"note":null,"type":"Armor","subType":null,"rarity":"Very Rare","magic":true,"quantity":1,"weight":6,"equipped":true,"attuned":true,"canAttune":true,"armorClass":2,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"While holding this Shield, you can take a Bonus Action to cause it to animate. The Shield leaps into the air and hovers in your space to protect you as if you were wielding it, leaving your hands free. The Shield remains animate for 1 minute, until you take a Bonus Action to end this effect, or until you die or have the Incapacitated condition, at which point the Shield falls to the ground or into your hand if you have one free.","limitedUse":null,"chargesUsed":0},{"id":"765438821","name":"Cloak of Protection","originalName":null,"note":null,"type":"Wondrous item","subType":null,"rarity":"Uncommon","magic":true,"quantity":1,"weight":0,"equipped":true,"attuned":true,"canAttune":true,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"You gain a +1 bonus to Armor Class and saving throws while you wear this cloak.","limitedUse":null,"chargesUsed":0},{"id":"1055962610","name":"Goggles of Night","originalName":null,"note":null,"type":"Wondrous item","subType":null,"rarity":"Uncommon","magic":true,"quantity":1,"weight":0,"equipped":true,"attuned":false,"canAttune":false,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"While wearing these dark lenses, you have Darkvision out to 60 feet. If you already have Darkvision, wearing the goggles increases its range by 60 feet.","limitedUse":null,"chargesUsed":0},{"id":"1063687025","name":"Ironlung Solamnic Armor","originalName":"Plate, +1","note":null,"type":"Armor","subType":null,"rarity":"Rare","magic":true,"quantity":1,"weight":65,"equipped":true,"attuned":false,"canAttune":false,"armorClass":18,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"You have a +1 bonus to AC while wearing this armor.","limitedUse":null,"chargesUsed":0},{"id":"813505608","name":"The Legendary Dragonlance","originalName":"Dragonlance (Pike)","note":"Improved Critical - Score crits on 18-20; Dragon Ally -  After attacking, any dragon ally can use reaction to make an attack; Death to Dragons - With a critical hit on a dragon, you deal damage equal to your current hit points.","type":"Weapon","subType":null,"rarity":"Legendary","magic":true,"quantity":1,"weight":18,"equipped":true,"attuned":true,"canAttune":true,"armorClass":null,"damage":"1d10","damageType":"Piercing","range":10,"longRange":10,"properties":["Heavy","Reach","Two-Handed","Push"],"magicBonus":3,"riders":[{"dice":"3d6","damageType":"force","when":"When you hit a dragon with this weapon"}],"snippet":"","description":"A dragonlance is a renowned weapon forged from rare metal with the aid of powerful artifacts associated with Bahamut. Different lances are forged for use by foot soldiers (as pikes) and by riders (as lances), but the magical properties of the weapons are the same.\n\r\nYou gain a +3 bonus to attack and damage rolls made with this magic weapon.\n\r\nWhen you hit a Dragon with this weapon, the Dragon takes an extra 3d6 force damage, and any Dragon of your choice that you can see within 30 feet of you can immediately use its reaction to make a melee attack.","limitedUse":null,"chargesUsed":0},{"id":"653171605","name":"Throwing Axe","originalName":"Handaxe","note":null,"type":"Weapon","subType":null,"rarity":"Common","magic":false,"quantity":1,"weight":2,"equipped":false,"attuned":false,"canAttune":false,"armorClass":null,"damage":"1d6","damageType":"Slashing","range":20,"longRange":60,"properties":["Light","Thrown","Vex"],"magicBonus":0,"riders":[],"snippet":"","description":"Proficiency with a Handaxe allows you to add your proficiency bonus to the attack roll for any attack you make with it.\n\r\n\r\nThis weapon has the following mastery property. To use this property, you must have a feature that lets you use it.\n\r\nVex. If you hit a creature with this weapon and deal damage to the creature, you have Advantage on your next attack roll against that creature before the end of your next turn.","limitedUse":null,"chargesUsed":0},{"id":"653171604","name":"Backpack","originalName":null,"note":null,"type":"Other Gear","subType":"Adventuring Gear","rarity":"Common","magic":false,"quantity":1,"weight":5,"equipped":true,"attuned":false,"canAttune":false,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"A backpack is a leather pack carried on the back, typically with straps to secure it. A backpack can hold 1 cubic foot/ 30 pounds of gear.\n\r\nYou can also strap items, such as a bedroll or a coil of rope, to the outside of a backpack.","limitedUse":null,"chargesUsed":0},{"id":"712049546","name":"Bucket","originalName":null,"note":null,"type":"Other Gear","subType":"Adventuring Gear","rarity":"Common","magic":false,"quantity":1,"weight":2,"equipped":true,"attuned":false,"canAttune":false,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"A Bucket holds up to half a cubic foot of contents.","limitedUse":null,"chargesUsed":0},{"id":"732376096","name":"A Holy-as-Fuck Symbol","originalName":"Holy Symbol","note":null,"type":"Other Gear","subType":"Holy Symbol","rarity":"Common","magic":false,"quantity":1,"weight":0,"equipped":false,"attuned":false,"canAttune":false,"armorClass":null,"damage":null,"damageType":null,"range":null,"longRange":null,"properties":[],"magicBonus":0,"riders":[],"snippet":"","description":"A Holy Symbol takes one of the forms in the Holy Symbol table and is bejeweled or painted to channel divine magic. A Cleric or Paladin can use a Holy Symbol as a Spellcasting Focus.\n\r\nThe table indicates whether a Holy Symbol needs to be held, worn, or borne on fabric (such as a tabard or banner) or a Shield.\n\r\n\r\nHoly Symbols\n\r\n\r\n\r\n\r\nSymbol\r\nWeight\r\nCost\r\n\n\r\n\r\n\r\n\r\
